<!DOCTYPE html>
<!--
  Ledger — phone-first draft.

  Tokens and layout are Graphite's and Anvil's, verbatim, so the three apps stay
  interchangeable: same dark palette, same 560px wrap, same fixed bottom nav,
  same card shape.

  SAFETY: no network code, no credentials, no write path. Reads data.js, which
  build.js generated from read-only dumps. Nothing here can reach a spreadsheet.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ledger</title>
<style>
  :root{
    color-scheme:dark;   /* page handles its own dark theme */
    /* Graphite's tokens, verbatim */
    --bg:#0d0f15; --bg2:#11131a; --card:#181b24; --card2:#1f2330; --line:#272b38;
    --txt:#eef1f7; --muted:#8a92a6; --accent:#3b82f6; --accent2:#7cb8ff;
    --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --r:18px;
    /* Category palette, validated against this card surface (#181b24) with the
       dataviz validator: lightness band PASS, chroma PASS, contrast PASS,
       worst adjacent CVD dE 7.7 — the floor band, legal only with secondary
       encoding, so every series is ALWAYS named in a legend or a direct label.
       Eight slots. A ninth category folds into Other; do not add a hue. */
    --c1:#3b82f6; --c2:#c03300; --c3:#33a569; --c4:#b68320;
    --c5:#c155ba; --c6:#7cb8ff; --c7:#5b6ee8; --c8:#d4564f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    overscroll-behavior-y:none;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom));}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px;}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    margin:0 -16px 14px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);}
  header h1{font-size:20px;margin:0;letter-spacing:.3px;line-height:1.1;}
  header h1 .dot{color:var(--accent)}
  /* How old is "today"? A finance app that shows a stale figure without saying
     so is worse than one that shows nothing. */
  .hdrsub{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.2px;}
  .hdrsub b{color:var(--txt);font-weight:600}
  .hdrsub.stale b{color:var(--warn)}
  header .hdrright{display:flex;align-items:center;gap:8px;}
  .hdrbtn{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;
    display:inline-flex;align-items:center;position:relative;}
  .hdrbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .hdrbtn.active{color:var(--accent);}
  .hdrbtn .dotbadge{position:absolute;top:-2px;right:-4px;min-width:15px;height:15px;
    background:var(--bad);color:#fff;border-radius:8px;font-size:9.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .curtog{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .curtog button{background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:600;
    padding:4px 8px;cursor:pointer;}
  .curtog button.on{background:var(--accent);color:#fff;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:16px;margin-bottom:14px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:0 0 13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  /* A heading that starts with a control reads as one phrase - "Food month by
     month" - so it must not be pushed apart the way a heading with an action
     on the right is. */
  /* The button in a group's top-right corner. One style everywhere. */
  .gbtn{background:var(--accent);border:1px solid var(--accent);color:#fff;
    border-radius:8px;min-width:26px;height:24px;padding:0 7px;font-size:14px;
    font-weight:700;line-height:1;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;
    text-transform:none;letter-spacing:0;}
  .gbtn:active{opacity:.8}
  .gbtn.ghost{background:none;color:var(--accent2);border-color:var(--line);font-weight:600;
    font-size:11.5px;letter-spacing:.2px}
  .tile.cls-essential{border-top-color:var(--accent);background:rgba(59,130,246,.10)}
  .tile.cls-optional{border-top-color:var(--warn);background:rgba(251,191,36,.10)}
  .tile.cls-income,.tile.cls-tax,.tile.cls-savings{border-top-color:var(--good);
    background:rgba(74,222,128,.09)}
  .tile.cls-other{border-top-color:var(--line)}
  .card h2 .act{text-transform:none;letter-spacing:0;font-weight:600;color:var(--accent2);
    cursor:pointer;font-size:12px;}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px;}
  .muted{color:var(--muted)}

  .hero{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.05;}
  .heroSub{color:var(--muted);font-size:12.5px;margin-top:5px;}
  .herodelta{font-size:13px;font-weight:700;letter-spacing:0;margin-left:9px;
    white-space:nowrap;font-variant-numeric:tabular-nums;}
  .herodelta i{font-style:normal;opacity:.7;font-size:11.5px;margin-left:3px}
  .kpis{display:flex;gap:8px;}
  .kpi{flex:1;min-width:0;background:var(--card2);border-radius:14px;padding:11px 10px;}
  /* The ? is a button in the box's corner, matching every other group action,
     rather than the whole box being mysteriously tappable. */
  .kpi{position:relative}
  .kpi .kq{position:absolute;top:6px;right:6px;width:18px;height:18px;padding:0;
    font-size:10px;border-radius:6px;background:none;border:1px solid var(--line);
    color:var(--accent2);font-weight:700;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;line-height:1}
  .kpi .kq:active{background:var(--bg2)}
  .kpi .l{padding-right:22px}
  .kpi .l{font-size:10px;color:var(--muted);line-height:1.25;text-transform:uppercase;letter-spacing:.4px;}
  .kpi .v{font-size:17px;font-weight:700;margin-top:4px;letter-spacing:-.2px;}
  .kpi .n{font-size:10px;color:var(--muted);margin-top:2px;}

  /* part-to-whole: one stacked bar. A 2-slice pie is an anti-pattern and a
     donut misreads when two shares are close, which cash and savings are. */
  .splitkeys{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;}
  .splitkey{display:flex;align-items:center;gap:6px;font-size:12px;}
  .splitkey .sw{width:10px;height:10px;border-radius:3px;flex:none;}
  .splitkey b{font-variant-numeric:tabular-nums;}
  .splitkey .pc{color:var(--muted);font-size:11px;}

  /* Compact part-to-whole: one bar, the amount written inside the segment.
     A segment too narrow to hold its number keeps it in the keys row below,
     which is the only case that still needs one. */
  .cbar{display:flex;height:30px;border-radius:9px;overflow:hidden;background:var(--bg2);gap:2px;}
  .cbar i{display:flex;align-items:center;justify-content:center;height:100%;min-width:0;
    font-size:12px;font-weight:700;font-style:normal;font-variant-numeric:tabular-nums;
    letter-spacing:-.2px;white-space:nowrap;overflow:hidden;}
  .cbar i .pc{font-weight:600;opacity:.72;margin-left:5px;font-size:10.5px;}

  /* Account tiles: four to a row at 352px, so ~82px each. Category decides the
     tint; the girls override it; closed goes grey and to the bottom. */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:8px 6px 7px;cursor:pointer;min-width:0;border-top:3px solid var(--line);}
  .tile:active{transform:scale(.97)}
  .tile .k{font-size:11px;font-weight:700;letter-spacing:-.1px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  /* Balances are shown whole, never abbreviated, so the type has to give. At
     9.5px "$254,714" is 47px inside an 82px tile; the widest real figure is
     "€1,030,546" and it still fits. */
  .tile .v{font-size:11px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;
    letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tile .v.long{font-size:9.5px;letter-spacing:-.4px}
  .tile .s{font-size:9px;color:var(--muted);margin-top:2px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .tile.cash   {border-top-color:var(--c1);background:rgba(59,130,246,.10)}
  .tile.savings{border-top-color:var(--c3);background:rgba(51,165,105,.10)}
  .tile.estate {border-top-color:var(--c4);background:rgba(182,131,32,.12)}
  .tile.excluded{border-top-color:var(--c6);background:rgba(124,184,255,.08)}
  .tile.girl   {border-top-color:var(--c5);background:rgba(193,85,186,.13)}
  .tile.shut   {border-top-color:#3a3f4d;background:rgba(138,146,166,.07);opacity:.62}
  /* Spending tiles: name, monthly average, and the change against last year.
     Red means it grew - on a cost, up is the bad direction. */
  /* Sections, coloured by what the spending IS. The label carries the meaning;
     the colour only reinforces it. */
  .secttl{display:flex;justify-content:space-between;align-items:baseline;
    font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;
    margin:14px 0 7px;padding-bottom:4px;border-bottom:2px solid var(--line);}
  .secttl:first-child{margin-top:0}
  .secttl span{font-size:11.5px;font-weight:600;text-transform:none;letter-spacing:0;
    font-variant-numeric:tabular-nums;color:var(--txt)}
  .secttl.ess{color:var(--accent);border-bottom-color:rgba(59,130,246,.45)}
  .secttl.opt{color:var(--warn);border-bottom-color:rgba(251,191,36,.45)}
  .secttl.oth{color:var(--muted)}
  .secttl.inc{color:var(--good);border-bottom-color:rgba(74,222,128,.45)}
  .tile.cat{border-top-color:var(--line);background:rgba(255,255,255,.03)}
  .tile.cat.ess{border-top-color:var(--accent);background:rgba(59,130,246,.09)}
  .tile.cat.opt{border-top-color:var(--warn);background:rgba(251,191,36,.09)}
  .tile.cat.inc{border-top-color:var(--good);background:rgba(74,222,128,.08)}
  .tile.cat .s.up{color:var(--bad);font-weight:700}
  .tile.cat .s.down{color:var(--good);font-weight:700}
  /* Two overlaid sliders make a range control. A native range input is the
     one thing on a phone that is already the right size for a thumb. */
  .rng{position:relative;height:30px;margin:10px 0 0}
  .rng input{position:absolute;left:0;right:0;top:0;width:100%;margin:0;
    -webkit-appearance:none;appearance:none;background:none;pointer-events:none;height:18px}
  .rng input::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px}
  .rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;
    width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);
    margin-top:-8px;cursor:pointer}
  .rng input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;
    background:var(--accent);border:2px solid var(--bg);cursor:pointer}
  .rngv{position:absolute;left:0;right:0;top:19px;display:flex;justify-content:space-between;
    font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .sepline{height:1px;background:var(--line);margin:14px -16px}
  /* Framed sections inside one card. The outline colour is the only thing
     carrying "this is the good kind of spending to grow", so each frame also
     names itself - never colour alone. */
  .frame{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
  .frame.inc{border-color:rgba(74,222,128,.45)}
  .frame.ess{border-color:rgba(59,130,246,.45)}
  .frame.opt{border-color:rgba(251,191,36,.45)}
  .frametop{display:flex;justify-content:space-between;align-items:baseline;
    font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    font-weight:600;margin-bottom:8px}
  .frametop span{font-size:12.5px;font-variant-numeric:tabular-nums;
    text-transform:none;letter-spacing:0}
  /* How much of a budget is gone. Red the moment it is over, because that is
     the only state you need to notice without reading a number. */
  .bbar{height:6px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-top:6px}
  .bbar i{display:block;height:100%;border-radius:4px;min-width:2px}
  .tile .alt2{color:var(--muted);font-variant-numeric:tabular-nums}
  /* Currency divider inside the grid. Euro accounts above, dollars below,
     because scanning a column of mixed symbols means reading every one. */
  .tiles .sep{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;
    font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;
    border-bottom:1px solid var(--line);padding-bottom:4px;margin:6px 0 1px;}
  .tiles .sep:first-child{margin-top:0}
  .tiles .sep span{font-size:11px;color:var(--txt);font-variant-numeric:tabular-nums;
    text-transform:none;letter-spacing:0}

  .field{margin-bottom:11px}
  .field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select{width:100%}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:5px 11px;
    font-size:12px;color:var(--muted);cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chip.pink.on{background:var(--c5);border-color:var(--c5)}
  .btn{display:block;width:100%;text-align:center;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);border-radius:12px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:inherit;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--bad);border-color:rgba(248,113,113,.35)}
  .btn+.btn{margin-top:7px}
  .btn[disabled]{opacity:.5;cursor:default}
  .btnrow{display:flex;gap:7px}.btnrow .btn{margin-top:0}
  /* Two date inputs side by side. A flex row clipped the third field, because
     a date input has an intrinsic width it will not go below. */
  .searchcard{padding:12px}
  .searchrow{display:flex;gap:8px;align-items:stretch}
  .searchrow input{flex:1;min-width:0;padding:9px 11px}
  /* The active filters, as removable chips, reading like a sentence. */
  .fbox{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center;
    background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;
    min-height:36px;}
  .fph{font-size:12.5px;color:var(--muted)}
  .fchip{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;
    border-radius:14px;padding:2px 4px 2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
  .fchip b{cursor:pointer;opacity:.75;font-weight:700;padding:0 4px}
  /* Bench's pattern: the menu hangs off the button, right-aligned so it never
     runs off the screen, and about a third of the phone wide. Absolute, so
     opening it does not push the list you are reading down the page. */
  .fdrop{position:relative;flex:none}
  .fmenu{position:absolute;right:0;top:100%;z-index:30;margin-top:6px;
    min-width:138px;max-width:min(230px,66vw);max-height:330px;overflow:auto;
    display:none;flex-direction:column;background:var(--card2);
    border:1px solid var(--line);border-radius:10px;padding:4px;
    box-shadow:0 10px 28px -8px rgba(0,0,0,.7)}
  .fmenu.show{display:flex}
  .fitem{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
    text-align:left;background:none;border:0;color:var(--txt);font-size:13px;
    padding:7px 9px;border-radius:7px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .fitem:hover,.fitem:active{background:var(--bg2)}
  .fitem span{color:var(--accent2);font-size:11px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis}
  .fitem.on{color:var(--accent2);font-weight:600}
  .fitem.danger{color:var(--bad)}
  .fback{font-size:11px;color:var(--muted);padding:5px 9px 7px;cursor:pointer;
    border-bottom:1px solid var(--line);margin-bottom:4px;font-weight:600}
  .fsep{height:1px;background:var(--line);margin:4px 0}
  .fmenu .fsearch{width:100%;font-size:12.5px;padding:6px 8px;margin-bottom:4px;flex:none}
  .fmenu .frow{display:flex;gap:5px;margin-bottom:4px}
  .fmenu .frow input{width:0;flex:1;min-width:0;font-size:12.5px;padding:6px 8px}
  .fmenu .fopts{overflow:auto;max-height:230px}
  .fmenu .fempty{padding:7px 9px;color:var(--muted);font-size:12px}
  .iconbtn{flex:none;width:42px;background:var(--card2);border:1px solid var(--line);
    border-radius:9px;color:var(--muted);cursor:pointer;display:flex;align-items:center;
    justify-content:center;position:relative;}
  .iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round}
  .iconbtn.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .iconbtn .dotbadge{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;
    background:var(--bad);color:#fff;border-radius:8px;font-size:9.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 3px;}

  .rows{display:flex;flex-direction:column;gap:2px;}
  .row{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--card2);
    border-radius:12px;cursor:pointer;}
  .row:active{transform:scale(.99)}
  .row .code{font-weight:700;font-size:13.5px;}
  .row .sub{font-size:11px;color:var(--muted);margin-top:1px;}
  .row .amt{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;}
  .row .amt b{font-size:14px;}
  .row .amt .alt{display:block;font-size:10.5px;color:var(--muted);}
  .row.flat{background:none;padding:8px 2px;border-bottom:1px solid var(--line);border-radius:0;}
  .row.flat:last-child{border-bottom:0}
  .tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:1px 5px;}


  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .gl{stroke:var(--line);stroke-width:1}
  .tick{fill:var(--muted);font-size:9.5px}
  .vlab{fill:var(--txt);font-size:9.5px;font-weight:700}
  .vlab.sm{font-size:8px;font-weight:600;letter-spacing:-.2px}
  .legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend .sw{width:10px;height:10px;border-radius:3px}

  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{padding:6px 4px;text-align:right;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.4px;
    border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}

  select,input{font:inherit;background:var(--card2);color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:6px 9px;font-size:13px;}
  input:disabled{color:var(--muted);background:var(--bg2);border-style:dashed;}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pill{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;
    font-size:12px;color:var(--muted);cursor:pointer}
  /* A segmented control, not pills: these are alternatives to one another and
     exactly one is always chosen, which a row of separate pills does not say. */
  .segs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
    text-transform:none;letter-spacing:0;}
  .seg{background:none;border:0;border-right:1px solid var(--line);color:var(--muted);
    font-size:10.5px;font-weight:600;padding:3px 8px;cursor:pointer;font-family:inherit;}
  .seg:last-child{border-right:0}
  .seg.on{background:var(--accent);color:#fff}

  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  /* The year, once, at the top. Sticky under the header so it stays reachable
     down a long tab, and dimmed on History which ignores it - a control that
     silently does nothing is worse than one that says it does nothing. */
  /* The year, in the header between the name and the currency. Compact: at
     384px the header also carries two icon buttons and the $/€ switch. */
  header{gap:8px}
  .hdrleft{flex:none;min-width:0}
  .hdryear{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
  .hdryear .ystep{margin:0;gap:2px;width:100%;justify-content:center}
  .ysel{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:7px;font-size:14px;font-weight:800;padding:2px 4px;
    font-variant-numeric:tabular-nums;letter-spacing:-.2px;}
  .hdryear.off{opacity:.4}
  /* One-off entries — a house sale, a car sale — in or out of everything.
     A button with a 1 in it, beside the year: both controls that change what
     every number on the screen means, side by side. */
  .onebtn{flex:none;width:26px;height:24px;border-radius:7px;font-size:12px;font-weight:800;
    background:var(--card2);border:1px solid var(--line);color:var(--muted);
    cursor:pointer;font-family:inherit;line-height:1;padding:0;
    display:inline-flex;align-items:center;justify-content:center;}
  .onebtn.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* The warning count, on the tab it concerns. */
  .navico{position:relative;display:inline-flex}
  .navwarn{position:absolute;top:-4px;right:-9px;min-width:14px;height:14px;
    background:var(--bad);color:#fff;border-radius:7px;font-size:9px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
    border:1.5px solid var(--bg2);}

  /* Year stepper. Thirteen years is too many for a pill row, and the year you
     want is nearly always one step from the one you are on. */
  .ystep{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .ybtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;
    width:42px;height:34px;font-size:14px;cursor:pointer;font-family:inherit;flex:none;
    display:flex;align-items:center;justify-content:center;}
  .ybtn:disabled{opacity:.32;cursor:default}
  .ybtn.now{font-size:9px;color:var(--muted);width:34px}
  .ybtn.now.on{color:var(--accent);border-color:var(--accent)}
  /* << date >> navigation, shared by anything with a history to walk. */
  .navrow{display:flex;align-items:center;gap:8px;margin-top:4px}
  .navval{flex:1;text-align:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .yval{flex:1;text-align:center;font-size:19px;font-weight:800;letter-spacing:-.3px;
    font-variant-numeric:tabular-nums;}


  /* A select that reads as part of the heading rather than a form control.
     Thirteen months of pills wrapped to three rows before you saw a number. */
  .inlinesel{background:var(--card2);border:1px solid var(--line);border-radius:8px;
    color:var(--txt);font-size:12px;font-weight:600;padding:3px 6px;text-transform:none;
    letter-spacing:0;max-width:150px;}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,19,26,.92);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:10;}
  nav button{background:none;border:none;color:var(--muted);font-size:9px;display:flex;
    flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 1px;flex:1;min-width:0;}
  nav button svg{width:21px;height:21px;display:block;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  nav button.active{color:var(--accent);}
  .tab{display:none}
  .tab.active{display:block}
  /* The fade belongs to ARRIVING somewhere, not to every redraw. It used to be
     on .tab, so pressing any button in the page replayed it - a flicker on
     every tap, which reads as the app losing its place. */
  .tab.enter{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
    animation:up .22s ease;}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet header{position:sticky;top:0}
  .find{background:var(--card2);border-radius:13px;padding:11px 12px;margin-bottom:8px;
    border-left:3px solid var(--line);}
  .find.high{border-left-color:var(--bad)} .find.medium{border-left-color:var(--warn)}
  .find.low{border-left-color:var(--muted)} .find.info{border-left-color:var(--accent)}
  .find .ft{font-weight:600;font-size:13px}
  .find .fd{color:var(--muted);font-size:11.5px;margin-top:4px;line-height:1.45}
  .find .fm{color:var(--muted);font-size:10px;margin-top:5px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="hdrleft">
      <h1>Ledger<span class="dot">.</span></h1>
      <div class="hdrsub" id="hdrSub"></div>
    </div>
    <!-- The year sits between the name and the currency, so the two controls
         that change what every number means are side by side. -->
    <div class="hdryear" id="yearBar"></div>
    <div class="hdrright">
      <span class="curtog" id="curTog">
        <button data-cur="USD" class="on">$</button><button data-cur="EUR">€</button>
      </span>
      <button class="hdrbtn" id="btnSettings" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
    </div>
  </header>

  <div id="tabs"></div>
</div>

<nav id="nav"></nav>
<div id="sheet"></div>

<script src="schema.js"></script>
<script src="dataset.js"></script>
<script src="backend.js"></script>
<script src="core.js"></script>
<script>
/* Chrome fires this when the app is installable, then expects US to call
   prompt() later. Caught at the top of the script because it fires early and
   once; without holding on to it there is no way to offer an Install button
   at all, and Chrome's own banner is not guaranteed to appear. */
let INSTALL_EVT = null;
addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); INSTALL_EVT = e;
  if (typeof render==='function') render(); });
addEventListener('appinstalled', ()=>{ INSTALL_EVT = null; render(); });

const APP_VERSION="17";
/* The shipped app has no data in it. `data.js` is only present in the private
   working copy; if it happens to be there it seeds a first run, otherwise the
   store starts empty and fills from an import or from what you type. */
const DS = window.LedgerData;
const BK = window.LedgerBackend;
let D = DS.load();
if (DS.isEmpty(D) && window.LEDGER_DATA) { D = DS.normalise(window.LEDGER_DATA); DS.save(D); }
/* The private working copy also carries tags.js; fold it in the first time so
   the real-data suites have categories. The shipped app never loads it, so a
   new install starts with none - which is the point. */
if (window.LEDGER_TAGS && !(D.taxonomy && D.taxonomy.parents.length) && !DS.isEmpty(D)) {
  const TG = window.LEDGER_TAGS;
  D.taxonomy = { parents: TG.PARENTS.map((p)=>({ id:p.id, label:p.label, cls:p.cls||'other' })),
    of: { ...TG.OF }, labels: {} };
}
const saveData = () => DS.save(D);
/* The real dataset lives in IndexedDB and arrives asynchronously. Boot on
   whatever is to hand, then swap it in. Core holds its own reference, so it
   has to be re-initialised rather than just reassigned here. */
async function adoptStored(){
  const d = await DS.loadAsync();
  if (DS.isEmpty(d) && !DS.isEmpty(D)) { DS.saveAsync(D); return; }
  if (DS.isEmpty(d)) return;
  D = d; LedgerCore.init(D); applyReg(); recomputeClock();
  /* Land on the newest year that actually has data, not on whatever the empty
     store guessed. */
  if (!YEARS.includes(state.year)) state.year = YEARS[YEARS.length-1];
  render();
}
const C = LedgerCore.init(D);
const REG = window.LEDGER_SCHEMA;
/* Which ink reads on each fill. Checked against the slot, not guessed: white
   on the amber slot is 2.7:1 and unreadable, near-black on it is 7.6:1. */
const INK = {'--c1':'#0d0f15','--c2':'#ffffff','--c3':'#0d0f15','--c4':'#0d0f15',
             '--c5':'#0d0f15','--c6':'#0d0f15','--c7':'#ffffff','--c8':'#ffffff'};
const LS = 'ledger-phone-v1';

/* Three layers, merged here and nowhere else: what build.js generated, what
   accounts.js declares, and what you have edited on this device. */
/* Opened from a file:// URL - which is exactly how the packed single-file
   copy arrives on a phone - localStorage is either unavailable or throws
   SecurityError depending on the browser. Falling back to memory means your
   edits last the session instead of killing the app on the first line. */
let CAN_SAVE = true;
function loadStore(){
  try { return JSON.parse(localStorage.getItem(LS) || '{}'); }
  catch (e) { CAN_SAVE = false; return {}; }
}
const store = Object.assign({ excludeOwners:[], dismissed:[], registry:{}, showOneOff:false, budgets:[],
    tagOf:{}, tagExtra:[], tagLabel:{}, tagGone:[], tagHidden:[], tagCls:{}, splits:{} }, loadStore());
const save = () => {
  if (!CAN_SAVE) return;
  try { localStorage.setItem(LS, JSON.stringify(store)); }
  catch (e) { CAN_SAVE = false; }
};

/* accounts.js is the seed for a first run only. Once the dataset has
   accounts of its own - imported or typed - those are the truth, with your
   per-device edits on top. */
function registry(){
  const out = {};
  /* No seeding from a shipped file. An app that arrives pre-populated with
     someone else's accounts is not an empty app. */
  for (const a of D.accounts) out[a.code] = { bank:a.bank, key:a.key, type:a.type,
    subtype:a.subtype, category:a.category, currency:a.currency, owners:a.owners,
    closed:a.closed, inWealth:a.inWealth, inSheet:a.inSheet };
  for (const [c,r] of Object.entries(store.registry||{})) out[c] = {...(out[c]||{}), ...r};
  return out;
}
const overridden = (code) => !!(store.registry||{})[code];

/* The tag taxonomy, same three layers: tags.js declares it, Settings > Tags
   overrides `tagOf` (a tag's parent) and `tagExtra` (parents you invent). */
function taxonomy(){
  /* Categories are data, in D.taxonomy, and start EMPTY on a new install.
     Each carries a class from the schema, and the class decides its kind -
     which is what the arithmetic sums it as. There is no override layer any
     more: an edit is an edit to the data, saved and exported like an entry. */
  const t = D.taxonomy || { parents:[], of:{}, labels:{} };
  const CLASSES = REG.CLASSES;
  const PARENTS = t.parents.map((p)=>({ id:p.id, label:p.label,
    cls: CLASSES[p.cls] ? p.cls : 'other',
    kind: (CLASSES[p.cls] || CLASSES.other).kind }));
  const byId = Object.fromEntries(PARENTS.map((p)=>[p.id,p]));
  return { PARENTS, OF: { ...t.of }, byId, CLASSES };
}
/* What a tag is CALLED here, which can differ from what the sheet calls it. */
const tagName = (t) => ((D.taxonomy||{}).labels||{})[t] || t;
const OWNERS = () => D.owners || {};
const ownerKind = (o) => (D.ownerKind||{})[o] || 'parent';
const isKid = (o) => ownerKind(o)==='kid';
const applyReg = () => { C.applyRegistry(registry(), OWNERS()); C.useTags(taxonomy()); };

/* Everything that changes the DATA rather than a per-device preference goes
   through here: re-derive, then redraw. One path, so no screen can show a
   figure the store does not hold.

   The init() is not redundant. Core snapshots the account list the first time
   applyRegistry runs and restores from that snapshot on every later call — so
   after adding an entry, the `years` touch() had just worked out were
   overwritten by a snapshot taken before the entry existed, and the account's
   money silently stopped counting. init() drops the snapshot. */
function afterDataChange(){ LedgerCore.init(D); applyReg(); recomputeClock(); }
function commit(){ saveData(); afterDataChange(); render(); }
applyReg();

/* The newest month with real activity. The sheet pads the rest of the year with
   the current figure so its formulas resolve, which must not be shown as fact. */
/* With nothing loaded there is no "latest month", so fall back to the real
   calendar. Every screen then shows an empty version of this year rather than
   an empty version of the year 0. */
const TODAY = new Date().toISOString().slice(0,10);
/* These describe the DATA, so they cannot be frozen at boot - the app starts
   on an empty store and the real dataset arrives from IndexedDB a moment
   later. Computing them once left the year dropdown with a single year and
   the header showing today instead of your last entry. Same shape of bug as
   the registry snapshot: anything derived from D has to be recomputed when D
   is replaced. */
let NOW, YEAR, LAST_ENTRY, YEARS;
function recomputeClock(){
  NOW = C.lastMonth() === '0000-00' ? TODAY.slice(0,7) : C.lastMonth();
  YEAR = +NOW.slice(0,4);
  LAST_ENTRY = C.lastEntry() === '0000-00-00' ? TODAY : C.lastEntry();
  YEARS = (D.realYears && D.realYears.length ? D.realYears.slice() : [YEAR])
    .sort((a,b)=>a-b);
}
recomputeClock();


const state = { cur:'USD', tab:'year', account:null, editing:false, spendMonth:null,
  year:YEAR, cmpA:YEARS[0], cmpB:YEAR, bill:null,
  openTag:null, settings:'data', tagPick:null, ownerEdit:null, entry:null, series:'total', wsel:'all',
  opFilter:{ q:'', tag:'', subtag:'', from:'', to:'', min:'', max:'', oneoff:false,
    dir:'', sort:'date', desc:true },
  opSplit:null, fmenu:null,
  prevDraft:null, prevIdx:null, renaming:null, histLo:null, histHi:null,
  clsPick:null, budget:null, budgetEdit:null, checks:false, check:null, savCur:'' };
/* One place decides whether one-offs are in. Every screen used to ask for
   livingOnly itself, which meant the switch would have had to be threaded
   through a dozen call sites and would have been missed in one of them. */
const opts = () => ({ cur:state.cur, synthetic:false, excludeOwners:store.excludeOwners,
  livingOnly: !store.showOneOff });

/* ------------------------------------------------------------------ format --*/
const sym = () => state.cur==='USD' ? '$' : '€';
const symOf = (c) => c==='USD' ? '$' : c==='EUR' ? '€' : c+' ';
function m0(v,s){ const r=Math.round(Math.abs(v));
  /* A cleared credit card holds -0.0000000001 after the float residue, and
     "-$0" reads like a fault rather than a zero balance. */
  return (v<0&&r!==0?'-':'')+(s||sym())+r.toLocaleString('en-US'); }
function m2(v,s){ const n=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (v<0?'-':'')+(s||sym())+n; }
const kk = (v) => { const a=Math.abs(v);
  return (a>=1e6? (v/1e6).toFixed(a>=1e7?0:1)+'M' : a>=1000? (v/1000).toFixed(a>=1e4?0:1)+'k' : Math.round(v)+''); };
/* Short, with the decimals that carry information. 1.88k rather than 1.9k,
   because a rounded thousand hides fifty pounds and that is most of the
   difference you were looking for - but 478k rather than 477.70k, because at
   twelve columns across 352px a seven-character label collides with its
   neighbours and then none of them can be read at all. Always five characters
   or fewer. */
const kk2 = (v) => { const a=Math.abs(v);
  if (a>=1e6) return (v/1e6).toFixed(2)+'M';
  if (a>=1e5) return Math.round(v/1000)+'k';
  if (a>=1e4) return (v/1000).toFixed(1)+'k';
  if (a>=1000) return (v/1000).toFixed(2)+'k';
  return Math.round(v)+''; };
/* Table cells. Seven columns of "$248,283" is 480px of text in a 352px
   column, so anything over ten thousand is abbreviated - the magnitude is
   what a month-by-month table is read for, and the exact figure is one tap
   away on the month itself. */
const tnum = (v) => Math.abs(v)>=10000 ? (v<0?'-':'')+sym()+kk(Math.abs(v)) : m0(v);
const esc = (s) => String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel = (m) => MON[+m.slice(5,7)-1];

/* The same thing, compact: one 30px bar with the amount written inside each
   segment. A segment narrower than about 90px cannot hold a number, so that
   one keeps its value in the keys row. Every segment is named there either
   way - identity is never carried by colour alone. */
function compactBar(parts, colors){
  const tot = parts.reduce((s,p)=>s+Math.abs(p.value),0) || 1;
  const pct = parts.map((p)=>Math.abs(p.value)/tot*100);
  const inside = pct.map((p)=>p>=26);
  return `<div class="cbar">${parts.map((p,i)=>
    `<i style="width:${pct[i].toFixed(2)}%;background:var(${colors[i]});color:${INK[colors[i]]||'#0d0f15'}">${
      inside[i] ? `${m0(p.value)}<span class="pc">${pct[i].toFixed(0)}%</span>` : ''}</i>`).join('')}</div>
  <div class="splitkeys">${parts.map((p,i)=>
    `<span class="splitkey"><span class="sw" style="background:var(${colors[i]})"></span>${esc(p.label)}${
      inside[i] ? '' : ` <b>${m0(p.value)}</b> <span class="pc">${pct[i].toFixed(0)}%</span>`}</span>`).join('')}</div>`;
}

/* Horizontal bars, one per category. A vertical bar chart needs its labels
   rotated or truncated once there are fifteen of them; a horizontal one gives
   each label a whole line and stays readable at 352px. Length carries the
   comparison, the number carries the value, and the monthly average sits
   under it because that is the figure you actually budget against. */

/* Columns. `diverging` splits above/below a zero line using the validated
   blue/red pair; otherwise a single accent. Values are labelled on the bars
   rather than relying on an axis, which is what makes it readable at 352px. */
function columns({ labels, values, diverging, color, height, precise, keys, dataAttr, selected }) {
  const W=352, H=height||132, T=14, B=16, L=0;
  const ih=H-T-B, n=labels.length||1;
  const max=Math.max(1,...values.map((v)=>Math.abs(v)));
  const step=W/n, bw=Math.min(24, step*0.62);
  const zero = diverging ? T+ih/2 : T+ih;
  const scale = diverging ? (ih/2)/max : ih/max;
  const fmt = precise ? kk2 : kk;
  let g=`<line class="gl" x1="0" y1="${zero}" x2="${W}" y2="${zero}"/>`;
  labels.forEach((lab,i)=>{
    const v=values[i]||0, cx=L+step*i+step/2, h=Math.abs(v)*scale;
    const up=v>=0, y=up? zero-h : zero;
    /* The selected column is the only one in the accent colour, so which month
       the list below belongs to is never in doubt. */
    const isSel = selected!==undefined && keys && keys[i]===selected;
    const col = isSel ? 'var(--accent)'
      : diverging ? (up?'var(--accent)':'var(--bad)') : `var(${color||'--c1'})`;
    /* A hit area the full height of the plot, not just the bar. A February
       with almost nothing in it is a two-pixel target otherwise. */
    const hit = keys && dataAttr
      ? `<rect x="${(cx-step/2).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${ih.toFixed(1)}"
          fill="transparent" style="cursor:pointer" ${dataAttr}="${esc(keys[i])}"/>` : '';
    g+=hit;
    if (h>0.4) g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}"
      height="${Math.max(2,h).toFixed(1)}" rx="3" fill="${col}" pointer-events="none"${
        isSel?' stroke="#fff" stroke-width="1.5"':''}/>`;
    if (Math.abs(v) > max*0.06)
      g+=`<text class="vlab${precise?' sm':''}" x="${cx.toFixed(1)}" y="${(up? y-3.5 : y+h+9).toFixed(1)}"
        text-anchor="middle" pointer-events="none">${fmt(v)}</text>`;
    g+=`<text class="tick" x="${cx.toFixed(1)}" y="${H-4}" text-anchor="middle"
      pointer-events="none">${esc(lab)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* Stacked columns for the category breakdown. 2px gaps between segments: the
   worst adjacent pair sits in the CVD floor band, so shape carries part of it. */
function stacked({ labels, series, colors, height }) {
  const W=352, H=height||160, T=14, B=16;
  const ih=H-T-B, n=labels.length||1;
  const tot=labels.map((_,i)=>series.reduce((s,sr)=>s+Math.abs(sr.values[i]||0),0));
  /* Wide columns, thin gaps. At twelve months a 62% bar leaves more air than
     ink and the shape gets harder to read, not easier. */
  const max=Math.max(1,...tot), step=W/n, bw=Math.min(30, step*0.86);
  const y=(v)=>T+ih-(v/max)*ih;
  let g='';
  labels.forEach((lab,i)=>{
    const cx=step*i+step/2; let acc=0;
    series.forEach((sr,si)=>{
      const v=Math.abs(sr.values[i]||0); if(!v) return;
      const y1=y(acc+v), raw=y(acc)-y1;
      /* Take the 2px separator out of TALL segments only. August 2026 is 4.7%
         of July and its eight segments are all under two pixels, so
         subtracting a flat 2 made the whole month disappear from the chart
         while the table still showed $4,074. A thin bar is honest; no bar is
         a lie. */
      const h = raw>4 ? raw-2 : Math.max(raw,0.6);
      if (h>0) g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}"
        height="${h.toFixed(1)}" rx="${acc+v>=tot[i]-.01?3:0}" fill="var(${colors[si]})"/>`;
      acc+=v;
    });
    /* Total above each column. One month can be ten times another - July, the
       move to France - and then every other bar is a sliver whose height says
       nothing. The number is readable when the shape is not. */
    if (tot[i] > max*0.06)
      g+=`<text class="vlab sm" x="${cx.toFixed(1)}" y="${(y(tot[i])-3.5).toFixed(1)}"
        text-anchor="middle">${kk2(tot[i])}</text>`;
    g+=`<text class="tick" x="${cx.toFixed(1)}" y="${H-4}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* A line over time, with real gaps left empty rather than bridged. */
function line({ points, height, color }) {
  const W=352, H=height||140, T=10, B=16, Lp=0;
  const ih=H-T-B;
  if (points.length<2) return `<p class="hint">Not enough month-ends yet.</p>`;
  const mn=(m)=>(+m.slice(0,4))*12+(+m.slice(5,7));
  const m0v=mn(points[0].m), span=Math.max(1, mn(points[points.length-1].m)-m0v);
  const max=Math.max(1,...points.map((p)=>p.v));
  const x=(p)=>Lp+(W-Lp)*(mn(p.m)-m0v)/span, y=(v)=>T+ih-(v/max)*ih;
  const segs=[]; let cur=[points[0]];
  for (let i=1;i<points.length;i++){
    if (mn(points[i].m)-mn(points[i-1].m) > 2){ segs.push(cur); cur=[]; }
    cur.push(points[i]);
  }
  segs.push(cur);
  let g=`<line class="gl" x1="0" y1="${T+ih}" x2="${W}" y2="${T+ih}"/>`;
  for (const s of segs){
    if (s.length<2){ if(s.length) g+=`<circle cx="${x(s[0]).toFixed(1)}" cy="${y(s[0].v).toFixed(1)}" r="2.5" fill="var(${color||'--c1'})"/>`; continue; }
    const d=s.map((p,i)=>`${i?'L':'M'}${x(p).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    g+=`<path d="${d}" fill="none" stroke="var(${color||'--c1'})" stroke-width="2" stroke-linejoin="round"/>`;
  }
  if (segs.length>1){
    const a=segs[0][segs[0].length-1], b=segs[1][0];
    g+=`<line x1="${x(a).toFixed(1)}" y1="${T}" x2="${x(a).toFixed(1)}" y2="${T+ih}" class="gl" stroke-dasharray="2 3"/>`
     + `<line x1="${x(b).toFixed(1)}" y1="${T}" x2="${x(b).toFixed(1)}" y2="${T+ih}" class="gl" stroke-dasharray="2 3"/>`
     + `<text class="tick" x="${((x(a)+x(b))/2).toFixed(1)}" y="${(T+ih/2).toFixed(1)}" text-anchor="middle">no data</text>`;
  }
  /* Keep 34px between labels. Time-proportional spacing puts 2015-12 and
     2016-01 a millimetre apart, so "every January plus the ends" collided into
     an unreadable smudge at both edges. */
  let lastX=-99;
  points.forEach((p,i)=>{
    const isEnd = i===0 || i===points.length-1;
    if (!isEnd && p.m.slice(5)!=='01') return;
    const px=x(p);
    if (!isEnd && Math.abs(px-lastX)<34) return;
    if (i===points.length-1 && px-lastX<34) return;
    lastX=px;
    g+=`<text class="tick" x="${px.toFixed(1)}" y="${H-4}" text-anchor="${
      i===0?'start':i===points.length-1?'end':'middle'}">${p.m.slice(0,4)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function currentCard(asOf, isNow){
  const o = { ...opts(), asOf };

  const last = w.filter((p)=>p.month<=asOf).pop() || {};
  const catCols = s.category.map((p)=>(REG.CATEGORY[p.key]||{}).color||'--c6');

     about whether the year went well. */
  const before = C.splits({ ...opts(), asOf: `${+asOf.slice(0,4)-1}-12` });
  const delta = before.total ? s.total - before.total : null;

const SERIES2 = [['all','All'],['cash','Cash'],['savings','Savings'],['estate','Property']];

/* The accumulating savings table. Month by month, but cumulative: what you had
   paid in by then, what it had grown by then, and the two as a ratio. $100 in
   with $50 of growth is +50%, which is the number that tells you whether the
   money is working. */
const SAVCUR = [['', 'Both'], ['EUR', 'Euro'], ['USD', 'Dollar']];

function savingsGroup(Y){
  const o = { ...opts(), onlyCurrency: state.savCur || '' };
  const sv = C.savingsMonths(Y, o);
  const ms = Object.keys(sv).filter((m)=>(Y<YEAR || m<=NOW) && sv[m].seen);
  /* The columns are LIFETIME: what has ever been paid in, what it has ever
     grown by, and the balance those two add up to. Your sheet keeps the
     Contributions and Interest columns cumulative from the day each account
     opened, and paid-in + growth = balance in 997 of its 998 rows, so the
     ratio between them is a real return. */
  const rows = ms.map((m)=>({ m,
    pin: sv[m].paidInTotal, grw: sv[m].growthTotal, bal: sv[m].balance,
    pc: Math.abs(sv[m].paidInTotal) > 0.5
      ? sv[m].growthTotal/Math.abs(sv[m].paidInTotal)*100 : null }));
  const last = rows[rows.length-1];
  const first = rows[0];
  /* This year's movement is the sum of the MONTHLY deltas, not the difference
     between the lifetime ends. An account that first appears in March would
     otherwise have its whole history counted as paid in this year. */
  const yPin = ms.reduce((t,m)=>t+sv[m].paidIn, 0);
  const yGrw = ms.reduce((t,m)=>t+sv[m].growth, 0);
  /* The MEASURED balance change, not paid-in plus growth. They differ by
     about a thousand dollars in 2026 because a few rows leave Contributions
     or Interest blank while the balance still moves - deriving it would hide
     that, and the gap is worth seeing. */
  const openBal = first ? first.bal - sv[ms[0]].paidIn - sv[ms[0]].growth : 0;
  const yBal = last ? last.bal - openBal : 0;

  return `
  <div class="card">
    <h2>Savings
      <span style="display:flex;align-items:center;gap:7px">
        <select id="savCur" class="inlinesel">${SAVCUR.map(([k,l])=>
          `<option value="${k}" ${(state.savCur||'')===k?'selected':''}>${l}</option>`).join('')}</select>
        <button class="gbtn ghost" data-explain="savtable">?</button>
      </span></h2>
    ${rows.length ? `<div class="scroll"><table>
      <thead><tr><th>Month</th><th>Paid in</th><th>Growth</th><th>%</th><th>Balance</th></tr></thead>
      <tbody>${rows.map((r)=>`<tr>
        <td>${mLabel(r.m)}</td>
        <td>${tnum(r.pin)}</td>
        <td style="color:${r.grw>=0?'var(--good)':'var(--bad)'}">${tnum(r.grw)}</td>
        <td style="color:${r.pc===null?'var(--muted)':r.pc>=0?'var(--good)':'var(--bad)'}">${
          r.pc===null?'—':(r.pc>0?'+':'')+r.pc.toFixed(0)+'%'}</td>
        <td><b>${tnum(r.bal)}</b></td></tr>`).join('')}</tbody>
    </table></div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="l">Paid in this year</div>
        <div class="v" style="font-size:15px">${m0(yPin)}</div></div>
      <div class="kpi"><div class="l">Growth this year</div>
        <div class="v" style="font-size:15px;color:${yGrw>=0?'var(--good)':'var(--bad)'}">${
          yGrw>=0?'+':''}${m0(yGrw)}</div></div>
      <div class="kpi"><div class="l">Balance change</div>
        <div class="v" style="font-size:15px;color:${yBal>=0?'var(--good)':'var(--bad)'}">${
          yBal>=0?'+':''}${m0(yBal)}</div></div>
    </div>`
    : `<div class="hint">No savings balances recorded for ${Y}${
        state.savCur?' in '+state.savCur:''}.</div>`}
  </div>`;
}


function tabYear(){
  const Y = state.year;
  const o = opts();
  const f = C.flows(Y, o);
  /* Cash only, for the Cash table. "In and out" that quietly includes an IRA
     contribution landing in a fund is not the household's cash flow. */
  const fc = C.flows(Y, { ...o, onlyCategory:'cash' });
  /* Cut at today only for the current year. An earlier year is complete, and
     hiding October to December of 2016 because it is past September would be
     nonsense. */
  const ms = Object.keys(f).filter((m)=> Y<YEAR ? true : m<=NOW)
    .filter((m)=>{ const b=f[m]; return Y<YEAR ? (b.income||b.spend||b.tax||b.saved) : true; });
  const sum = (kx)=>ms.reduce((s,m)=>s+f[m][kx],0);
  /* The Summary is built by CLASS, not by the row type the importer inferred:
     income includes Interest, taxes exclude the property tax filed under
     Home, and cash left is in minus everything out. */
  const YS = C.yearSummary(Y, { ...o, upto: Y<YEAR ? Y+'-12' : NOW });
  const sumC = (kx)=>ms.reduce((s,m)=>s+fc[m][kx],0);

  const byMonth = {}; for (const p of inY) byMonth[p.month] = p;

  if (DS.isEmpty(D)) return `

    ${wm.some((p)=>!p.empty) ? stacked({
      labels: wm.map((p)=>mLabel(p.month)),

      colors: stackCols, height:172 })
      : `<div class="hint">No month-ends recorded for ${Y}.</div>`}
  </div>

  ${savingsGroup(Y)}

  <div class="card">
    <h2>Summary <span class="muted" style="text-transform:none;letter-spacing:0">${Y} · ${ms.length} months</span></h2>
    <div class="kpis">
      <div class="kpi"><button class="kq" data-explain="in">?</button><div class="l">In</div>

      <div class="kpi"><button class="kq" data-explain="out">?</button><div class="l">Out</div>

}

/* ------------------------------------------------------- explaining a box --

   Every figure in the Summary is a sum of something, and two of them look like
   they should agree and do not. Rather than a paragraph of prose that goes
   stale, each box opens its own working: where the number comes from, and the
   live breakdown by source. If the two disagree, that is a fact about your
   records and you should be able to see which side is which.               */

function explainBox(kind){
  const Y = state.year, o = opts();
  const f = C.flows(Y, o);
  const fc = C.flows(Y, { ...o, onlyCategory:'cash' });
  const ms = Object.keys(f).filter((m)=> Y<YEAR || m<=NOW);
  const sv = C.savingsMonths(Y, o);
  const svms = Object.keys(sv).filter((m)=>(Y<YEAR||m<=NOW) && sv[m].seen);
  const tot = (src,k)=>ms.reduce((s,m)=>s+(src[m]?src[m][k]:0),0);
  const svTot = (k)=>svms.reduce((s,m)=>s+sv[m][k],0);
  const YS = C.yearSummary(Y, { ...o, upto: Y<YEAR ? Y+'-12' : NOW });

  /* Per-tag breakdown. "Where it comes from" answers which account; this
     answers what it was for, which is the other half of checking a figure. */
  const byTag = (pred) => {
    const t={};
    for (const r of C.rows(o)){
      if (!r.month.startsWith(String(Y))) continue;
      if (Y===YEAR && r.month>NOW) continue;
      if (o.livingOnly && r.oneoff) continue;
      if (!pred(r)) continue;
      t[r.group]=(t[r.group]||0)+C.conv(r.amount,r.currency,r.month,state.cur);
    }
    return Object.entries(t).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  };

  /* Per-source breakdown, so the number can be checked rather than believed. */
  const byAccount = (pred) => {
    const t={};
    for (const r of C.rows(o)){
      if (!r.month.startsWith(String(Y))) continue;
      if (Y===YEAR && r.month>NOW) continue;
      if (o.livingOnly && r.oneoff) continue;
      if (!pred(r)) continue;
      t[r.account]=(t[r.account]||0)+C.conv(r.amount,r.currency,r.month,state.cur);
    }
    return Object.entries(t).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  };
  const paidInByAccount = () => {
    const t={};
    for (const a of D.accounts.filter((x)=>x.category==='savings')){
      const h=D.positions.filter((p)=>p.code===a.code).sort((x,y)=>x.month<y.month?-1:1);
      let v=0;
      for (let i=1;i<h.length;i++){
        if (!h[i].month.startsWith(String(Y))) continue;
        if (Y===YEAR && h[i].month>NOW) continue;
        if (h[i].contributions===null||h[i-1].contributions===null) continue;
        v+=C.conv(h[i].contributions-h[i-1].contributions,a.currency,h[i].month,state.cur);
      }
      if (Math.abs(v)>0.5) t[a.key||a.code]=v;
    }
    return Object.entries(t).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  };

  const BOX = {
    in: { title:'In', value: YS.in,
      from:'Every entry in an Income category, which includes Interest.',
      rows: byAccount((r)=>C.classOf(r.group)==='income'),
      tags: byTag((r)=>C.classOf(r.group)==='income') },
    out: { title:'Out', value: YS.out,
      from:'Everything classed Necessary, Optional or Other.'
        + (store.showOneOff?' One-offs are included — the 1 in the top bar is on.'
          :' One-offs are excluded.'),
      rows: byAccount((r)=>['essential','optional','other'].includes(C.classOf(r.group))),
      tags: byTag((r)=>['essential','optional','other'].includes(C.classOf(r.group))) },
    taxes: { title:'Taxes', value: YS.taxes,
      from:'Every entry in the Tax category. Property tax is NOT here — it is '
        + 'filed under Home, as a cost of the house.',
      rows: byAccount((r)=>C.classOf(r.group)==='tax'),
      tags: byTag((r)=>C.classOf(r.group)==='tax') },
    savings: { title:'Savings', value: YS.savings,
      from:'Everything tagged Savings. That currently covers two different '
        + 'things: money moved into a savings account, AND the principal part '
        + 'of a mortgage payment. Both build net worth, but they are not the '
        + 'same decision — a second tag would split them.',
      rows: byAccount((r)=>C.classOf(r.group)==='savings'),
      tags: byTag((r)=>C.classOf(r.group)==='savings') },
    paidin: { title:'Paid in', value: svTot('paidIn'),
      from:'The Contributions column on each investment tab, month over month. '
        + 'Recorded on the savings account itself, not in the ledger.',
      rows: paidInByAccount() },
    growth: { title:'Growth', value: svTot('growth'),
      from:'The Interest column on each investment tab, month over month. '
        + 'What the market did, as your sheet recorded it.',
      rows: [] },
    cashleft: { title:'Cash left', value: YS.left,
      from:'In − (out + taxes + savings).', rows: [],
      groups: [['The four parts', [['In', YS.in], ['Out', -YS.out],
        ['Taxes', -YS.taxes], ['Savings', -YS.savings]]]] },
    worth: { title:'Net worth change', value: (function(){
        const w=C.wealth(o).filter((p)=>p.month.slice(0,4)===String(Y));
        return w.length ? w[w.length-1].total - w[0].total : 0; })(),
      from:'The roll-up at the end of the year minus the roll-up at the start. '
        + 'Includes market moves and property, so it is not in minus out.', rows: [] },
  };

  /* Net worth: the same total sliced three ways, which is the only way to see
     that the slices really are the same money. */
  const lat = C.latest({ ...o, includeClosed:false, asOf: Y<YEAR ? Y+'-12' : NOW });
  const mine = lat.filter((a)=>a.inWealth!==false && !C.ownerExcluded(a, store.excludeOwners));
  const slice = (pred) => mine.filter(pred)
    .map((a)=>[ (a.key||a.code) + (a.currency!==state.cur?' ('+a.currency+')':''), a.shown ])
    .sort((x,y)=>Math.abs(y[1])-Math.abs(x[1]));
  BOX.networth = { title:'Net worth', value: mine.reduce((t,a)=>t+a.shown,0),
    from:'Every account you count, at its latest balance, converted at that '
      + "month's own rate.",
    groups: [
      ['By currency — dollars', slice((a)=>a.currency==='USD')],
      ['By currency — euros', slice((a)=>a.currency==='EUR')],
      ['Cash', slice((a)=>a.category==='cash')],
      ['Savings', slice((a)=>a.category==='savings')],
      ['Property', slice((a)=>a.category==='estate')],
    ].filter(([,l])=>l.length) };

  const sb = C.savingsByAccount(Y, { ...o, onlyCurrency: state.savCur||'',
    upto: Y<YEAR ? Y+'-12' : NOW });
  BOX.savtable = { title:'Savings', value: sb.reduce((t,x)=>t+(x.balance||0),0),
    from:'Paid in and growth are the Contributions and Interest columns on each '
      + 'investment tab, month over month, accumulated. The percentage is growth '
      + 'divided by what you paid in — $100 in with $50 of growth is +50%.',
    groups: [['Paid in this year', sb.filter((x)=>Math.abs(x.paidIn)>0.5)
        .map((x)=>[x.key, x.paidIn])],
      ['Growth this year', sb.filter((x)=>Math.abs(x.growth)>0.5)
        .map((x)=>[x.key, x.growth])],
      ['Balance', sb.filter((x)=>x.balance).map((x)=>[x.key, x.balance])]]
      .filter(([,l])=>l.length) };

  /* One-offs list their entries rather than explaining themselves in a
     paragraph — the four rows ARE the explanation. */
  BOX.oneoff = { title: 'One-offs', value: (function(){
      const g = C.flows(Y, o);
      return Object.keys(g).filter((m)=>Y<YEAR||m<=NOW)
        .reduce((t,m)=>t+g[m].oneoff, 0); })(),
    from: 'Large one-time amounts sitting in an everyday category — a house '
      + 'sale tagged Home, a car sale tagged Car. Held apart so they do not '
      + 'net against the groceries. The 1 in the top bar puts them back in.',
    rows: [],
    entries: C.rows({ ...o, livingOnly:false }).filter((r)=>r.oneoff
      && r.month.startsWith(String(Y)) && (Y<YEAR || r.month<=NOW)) };

  const b = BOX[kind]; if (!b) return;

  /* The one pair that looks contradictory and is not. */
  const pair = (kind==='savings'||kind==='paidin') ? (function(){
    const a=Math.abs(tot(f,'saved')), p=svTot('paidIn');
    return `<div class="card">
      <h2>Why these two differ</h2>
      <div class="rows">

          <div class="sub">left your accounts</div></div>
          <div class="amt"><b>${m0(a)}</b></div></div>

        Contributions column.</div>
    </div>`;})() : '';

  document.getElementById('sheet').innerHTML = `
  <div class="sheet"><div class="wrap">

      <div class="hdrright"><button class="hdrbtn" id="closeSheet">

    <div class="card">
      <div class="hero">${m0(Math.abs(b.value))}</div>

    </div>
    ${(b.rows||[]).length?`<div class="card">
      <h2>Where it comes from</h2>

      <h2>Per tag</h2>

      <div class="rows">${b.entries
        .slice().sort((x,y)=>Math.abs(y.amount)-Math.abs(x.amount)).map((r)=>{
          const v = C.conv(r.amount,r.currency,r.month,state.cur);
          return `<div class="row flat"><div>
            <div class="code" style="font-size:12.5px">${esc((r.party||'—').slice(0,24))}</div>

/* ------------------------------------------------------------------- Spend --*/

/* Elapsed months, so an average is per month lived rather than per month on
   the calendar. Mid-September is 8.6, and dividing by 9 understates every
   figure on the screen by the same wrong twelfth. */
function monthsIn(yr){
  if (yr < YEAR) return 12;
  if (yr > YEAR) return 1;
  const mm=+NOW.slice(5,7), d=+LAST_ENTRY.slice(8,10);
  return (mm-1) + d/new Date(Date.UTC(yr, mm, 0)).getUTCDate();
}

/* Everything a category did in a year. Amounts are summed SIGNED, so a refund
   tagged Food subtracts from Food - which is what "take the reimbursement
   into account" has to mean for the average to be worth anything. */
function spendByParent(Y){
  const o = opts();
  /* Everything with a monthly rhythm, not only spending: income, tax and what
     went into savings belong in the same picture, coloured differently. */
  const rows = C.rows(o).filter((r)=>+r.month.slice(0,4)===Y
    && r.type!=='transfer' && r.type!=='interest'
    && !(o.livingOnly && r.oneoff));
  const out = {};
  for (const r of rows){
    const id=C.parentOf(r.group);
    const b=out[id]||(out[id]={ id, total:0, months:{}, rows:[] });
    const v=C.conv(r.amount,r.currency,r.month,state.cur);
    b.total+=v; b.months[r.month]=(b.months[r.month]||0)+v; b.rows.push(r);
  }
  return out;
}

/* The order the sections appear in, and what each one is called on screen.
   Necessities first because that is the part you cannot change. */
const SPEND_SECTIONS = [
  { cls:'essential', label:'Necessary', tone:'ess' },
  { cls:'optional',  label:'Optional',  tone:'opt' },
  { cls:'other',     label:'Other',     tone:'oth' },
  { cls:'income',    label:'Income',    tone:'inc' },
  { cls:'savings',   label:'Savings',   tone:'inc' },
  { cls:'tax',       label:'Taxes',     tone:'inc' },
];

/* The month-by-month flow tables. They lived on Year, where they competed with
   the net-worth picture; here they sit with the rest of the activity. */
function flowTables(Y){
  const o = opts();
  const f = C.flows(Y, o);
  const fc = C.flows(Y, { ...o, onlyCategory:'cash' });
  const ms = Object.keys(f).filter((m)=> Y<YEAR ? true : m<=NOW)
    .filter((m)=>{ const b=f[m]; return Y<YEAR ? (b.income||b.spend||b.tax||b.saved) : true; });
  const sumC = (kx)=>ms.reduce((s2,m)=>s2+fc[m][kx],0);
  const cashLeft = sumC('income')+sumC('spend')+sumC('tax')+sumC('saved')+sumC('oneoff');
  const sv = C.savingsMonths(Y, o);
  const svMs = Object.keys(sv).filter((m)=>(Y<YEAR||m<=NOW) && sv[m].seen);
  const svSum = (kx)=>svMs.reduce((s2,m)=>s2+sv[m][kx],0);
  return `
  <div class="card">
    <h2>Cash <button class="gbtn ghost" data-which="cash">?</button></h2>
    <div class="scroll"><table>
      <thead><tr><th>Month</th><th>In</th><th>Out</th><th>Tax</th><th>Saved</th><th>Left</th></tr></thead>
      <tbody>${ms.map((m)=>`<tr><td>${mLabel(m)}</td>
        <td style="color:var(--good)">${tnum(fc[m].income)}</td>
        <td style="color:var(--bad)">${tnum(-fc[m].spend)}</td>
        <td>${Math.abs(fc[m].tax)>1?tnum(Math.abs(fc[m].tax)):'—'}</td>
        <td>${Math.abs(fc[m].saved)>1?tnum(Math.abs(fc[m].saved)):'—'}</td>
        <td style="color:${fc[m].net>=0?'var(--good)':'var(--bad)'}">${tnum(fc[m].net)}</td></tr>`).join('')}
        <tr><td><b>Year</b></td>
          <td style="color:var(--good)"><b>${tnum(sumC('income'))}</b></td>
          <td style="color:var(--bad)"><b>${tnum(-sumC('spend'))}</b></td>
          <td><b>${tnum(Math.abs(sumC('tax')))}</b></td>
          <td><b>${tnum(Math.abs(sumC('saved')))}</b></td>
          <td style="color:${cashLeft>=0?'var(--good)':'var(--bad)'}"><b>${tnum(cashLeft)}</b></td></tr>
      </tbody>
    </table></div>
  </div>

  <div class="card">
    <h2>Savings <button class="gbtn ghost" data-which="savings">?</button></h2>
    ${svMs.length ? `<div class="scroll"><table>
      <thead><tr><th>Month</th><th>Paid in</th><th>Growth</th><th>Balance</th></tr></thead>
      <tbody>${svMs.map((m)=>`<tr><td>${mLabel(m)}</td>
        <td>${Math.abs(sv[m].paidIn)>1?tnum(sv[m].paidIn):'—'}</td>
        <td style="color:${sv[m].growth>=0?'var(--good)':'var(--bad)'}">${
          Math.abs(sv[m].growth)>1?tnum(sv[m].growth):'—'}</td>
        <td><b>${tnum(sv[m].balance)}</b></td></tr>`).join('')}
        <tr><td><b>Year</b></td>
          <td><b>${tnum(svSum('paidIn'))}</b></td>
          <td style="color:${svSum('growth')>=0?'var(--good)':'var(--bad)'}"><b>${tnum(svSum('growth'))}</b></td>
          <td></td></tr>
      </tbody>
    </table></div>`
    : `<div class="hint">No savings balances recorded for ${Y}.</div>`}
  </div>
`;
}


function tabSpend(){
  if (state.budgetEdit) return budgetForm();
  if (state.budget) return budgetDetail(state.budget);
  if (state.prevDraft) return previsionEditor();
  if (state.spendCat) return spendDetail(state.spendCat);
  const Y = state.year;
  const tax = taxonomy();
  const now = spendByParent(Y), prev = spendByParent(Y-1);
  const div = monthsIn(Y), pdiv = monthsIn(Y-1);
  const cells = tax.PARENTS.filter((p)=>now[p.id] || prev[p.id])
    .map((p)=>{
      const avg = Math.abs((now[p.id]||{total:0}).total)/div;
      const pavg = prev[p.id] ? Math.abs(prev[p.id].total)/pdiv : null;
      return { p, avg, pavg, diff: pavg===null?null:avg-pavg };
    });
  const grand = cells.reduce((s,c)=>s+c.avg,0);

  return `
  <div class="card">
    <h2>Spending
      <span class="muted" style="text-transform:none;letter-spacing:0">${m0(grand)}/mo</span></h2>
    ${SPEND_SECTIONS.map((sec)=>{
      const mine = cells.filter((c)=>(c.p.cls||'other')===sec.cls);
      if (!mine.length) return '';
      const tot = mine.reduce((t,c)=>t+c.avg,0);
      return `<div class="secttl ${sec.tone}">${esc(sec.label)}<span>${m0(tot)}/mo</span></div>
      <div class="tiles">${mine.map((c)=>`
        <div class="tile cat ${sec.tone}" data-opencat="${esc(c.p.id)}">
          <div class="k">${esc(c.p.label)}</div>
          <div class="v">${m0(c.avg)}</div>
          <div class="s ${c.diff===null?'':c.diff>0?'up':'down'}">${
            c.diff===null ? '—'
            : (c.diff>0?'+':'−')+m0(Math.abs(c.diff)).replace(/^[-+]/,'')}</div>
        </div>`).join('')}</div>`;
    }).join('')}
  </div>

  ${previsionCard(Y)}

  ${budgetCard()}

  ${flowTables(Y)}`;
}

/* One category, opened. The chart answers "when", the list answers "on what",
   and the two are the same numbers - tapping a column filters the list. */
function spendDetail(id){
  const Y = state.year;
  const tax = taxonomy();
  const label = (tax.byId[id]||{}).label || id;
  const data = spendByParent(Y)[id] || { total:0, months:{}, rows:[] };
  const ms = Object.keys(data.months).sort();
  const sel = state.spendMonth && ms.includes(state.spendMonth) ? state.spendMonth : null;
  const div = monthsIn(Y);
  const prev = spendByParent(Y-1)[id];
  const pavg = prev ? Math.abs(prev.total)/monthsIn(Y-1) : null;
  const avg = Math.abs(data.total)/div;

  const base = sel ? data.rows.filter((r)=>r.month===sel) : data.rows;
  const list = filterOps(base);

  return `
  <div class="card">
    <h2><span class="act" data-backcat="1">‹ Spending</span> ${esc(label)}</h2>
    <div class="hero">${m0(Math.abs(data.total))}</div>
    <div class="heroSub">${Y} · ${m0(avg)} a month${
      pavg!==null?` · <b style="color:${avg>pavg?'var(--bad)':'var(--good)'}">${
        avg>pavg?'+':'−'}${m0(Math.abs(avg-pavg)).replace(/^[-+]/,'')}</b> against ${Y-1}`:''}</div>
  </div>

  <div class="card">
    <h2>By month${sel?` <button class="gbtn ghost" data-monthclear="1">All</button>`:''}</h2>
    ${ms.length ? columns({ labels:ms.map(mLabel), values:ms.map((m)=>Math.abs(data.months[m])),
        color:'--c2', height:150, precise:true, keys:ms, dataAttr:'data-pickmonth',
        selected: sel||undefined })
      : `<div class="hint">Nothing in ${Y}.</div>`}
    <div class="hint" style="margin-top:2px">${sel
      ? `Showing ${MON[+sel.slice(5,7)-1]} only.` : 'Tap a month to filter the list below.'}</div>
  </div>

  ${opFilterCard(base, list.length)}

  <div class="card">
    <h2>${sel?MON[+sel.slice(5,7)-1]+' '+Y:'Every entry'}
      <span class="muted" style="text-transform:none;letter-spacing:0">${list.length}</span></h2>
    <div class="rows">${list.slice(0,200).map((r)=>{
      const v = C.conv(r.amount,r.currency,r.month,state.cur);
      /* Credits green, debits red. A refund inside a spending category is the
         thing most easily misread as another cost. */
      return `<div class="row flat" data-editentry="${esc(r.src)}"><div>
        <div class="code" style="font-size:12.5px;font-weight:600">${esc((r.party||'—').slice(0,26))}</div>
        <div class="sub">${r.date.slice(5)} · ${esc(r.group)} · ${esc(r.account)}${
          r.oneoff?' · <b>one off</b>':''}</div></div>
        <div class="amt"><b style="color:${v>0?'var(--good)':'var(--bad)'}">${m2(v)}</b>
        ${r.currency!==state.cur?`<span class="alt">${m2(r.amount,symOf(r.currency))}</span>`:''}</div>
      </div>`;}).join('')}</div>
    ${list.length>200?`<div class="hint">Newest 200 of ${list.length}.</div>`:''}
    ${!list.length?`<div class="hint">Nothing here.</div>`:''}
  </div>`;
}

/* ------------------------------------------------------------- Budgets ----

   A budget is a name, an amount, and a tag you can put on entries. Tag a
   purchase with it and it counts against the budget - which is how "how much
   of the kitchen money is left" gets answered without inventing a category
   that then pollutes every year-on-year comparison.

   It is deliberately NOT a category: a fridge is Furniture and also
   "Kitchen 2026", and both facts stay true.                                 */

const budgets = () => store.budgets || (store.budgets = []);
const budgetOf = (id) => budgets().find((b)=>b.id===id);
const budgetRows = (id) => C.rows({ ...opts(), livingOnly:false })
  .filter((r)=>r.budget===id);
const budgetSpent = (id) => budgetRows(id)
  .reduce((s,r)=>s+Math.abs(C.conv(r.amount,r.currency,r.month,state.cur)),0);

/* A closed budget is finished business. It stays visible in the year it closed
   and every year before - the spending really happened - and disappears from
   the years after, because a kitchen you finished in 2024 is not a 2026
   concern. */
const budgetLive = (b, Y) => !b.closed || +String(b.closed).slice(0,4) >= Y;

function budgetCard(){
  const list = budgets().filter((b)=>budgetLive(b, state.year));
  return `
  <div class="card">
    <h2>Budget <button class="gbtn" data-newbudget="1">+</button></h2>
    ${!list.length?``
    : `<div class="rows">${list.map((b)=>{
        const spent = budgetSpent(b.id), pc = b.amount ? spent/b.amount*100 : 0;
        const over = spent > b.amount;
        return `<div class="row" data-openbudget="${esc(b.id)}">
          <div style="flex:1;min-width:0">
            <div class="code">${esc(b.name)}${b.closed?`<span class="tag">closed</span>`:''}</div>
            <div class="bbar"><i style="width:${Math.min(100,pc).toFixed(1)}%;
              background:${over?'var(--bad)':'var(--c3)'}"></i></div>
          </div>
          <div class="amt"><b style="color:${over?'var(--bad)':'var(--txt)'}">${m0(spent)}</b>
            <span class="alt">of ${m0(b.amount)}</span></div>
        </div>`;}).join('')}</div>`}
  </div>`;
}

function budgetForm(){
  const b = state.budgetEdit;
  return `
  <div class="card">
    <h2><span class="act" data-bcancel="1">‹ Spend</span> ${b.id?'Edit budget':'New budget'}</h2>
    <div class="field"><label>Name</label>
      <input id="bName" value="${esc(b.name||'')}" placeholder="e.g. Kitchen, Italy 2026"></div>
    <div class="field"><label>Amount in ${esc(state.cur)}</label>
      <input id="bAmount" value="${esc(String(b.amount||''))}" inputmode="decimal" placeholder="0"></div>
    <div class="btnrow">
      <button class="btn primary" data-bsave="1">${b.id?'Save':'Create'}</button>
      <button class="btn" data-bcancel="1">Cancel</button>
    </div>
    ${b.id?`<button class="btn danger" style="margin-top:7px" data-bdelete="${esc(b.id)}">
      Delete this budget</button>`:''}
    
  </div>`;
}

/* Inside a budget: what it has eaten, grouped by the category the spending
   actually belongs to. A kitchen budget is mostly Furniture with some Home
   and a surprising amount of Misc, and that breakdown is the useful part. */
function budgetDetail(id){
  const b = budgetOf(id);
  if (!b) { state.budget=null; return tabSpend(); }
  const rows = budgetRows(id);
  const spent = budgetSpent(id);
  const left = b.amount - spent;
  const tax = taxonomy();
  const byCat = {};
  for (const r of rows){
    const p = C.parentOf(r.group);
    (byCat[p] || (byCat[p]={ id:p, label:(tax.byId[p]||{}).label||p, total:0, rows:[] }));
    byCat[p].total += Math.abs(C.conv(r.amount,r.currency,r.month,state.cur));
    byCat[p].rows.push(r);
  }
  const groups = tax.PARENTS.filter((p)=>byCat[p.id]).map((p)=>byCat[p.id]);

  return `
  <div class="card">
    <h2><span class="act" data-bback="1">‹ Activity</span>
      <button class="gbtn ghost" data-bedit="${esc(id)}">Edit</button></h2>
    <div class="heroSub" style="margin-top:0;color:var(--txt);font-size:15px;font-weight:700">${
      esc(b.name)}${b.closed?' <span class="tag">closed</span>':''}</div>
    <div class="hero">${m0(spent)}</div>
    <div class="heroSub">of ${m0(b.amount)} — <b style="color:${
      left>=0?'var(--good)':'var(--bad)'}">${left>=0?m0(left)+' left':m0(-left)+' over'}</b></div>
    <div class="bbar" style="margin-top:12px;height:10px"><i style="width:${
      Math.min(100, b.amount?spent/b.amount*100:0).toFixed(1)}%;
      background:${left<0?'var(--bad)':'var(--c3)'}"></i></div>
    <div class="heroSub" style="margin-top:8px">${rows.length} entr${rows.length===1?'y':'ies'}
      across ${groups.length} categor${groups.length===1?'y':'ies'}${
      b.closed?` · closed ${esc(b.closed)}`:''}</div>
    <button class="btn ${b.closed?'':'danger'}" style="margin-top:12px"
      data-bclose="${esc(id)}">${b.closed?'Reopen':'Close'}</button>
  </div>

  ${!rows.length?`<div class="card"><div class="hint" style="margin-top:0">Nothing tagged with this

        style="text-transform:none;letter-spacing:0">${m0(g.total)}</span></h2>
      <div class="rows">${g.rows
        .sort((x,y)=> x.date<y.date?1:-1).map((r)=>{
        const v = C.conv(r.amount,r.currency,r.month,state.cur);
        return `<div class="row flat" data-editentry="${esc(r.src)}"><div>
          <div class="code" style="font-size:12.5px;font-weight:600">${esc((r.party||'—').slice(0,26))}</div>
          <div class="sub">${r.date} · ${esc(r.group)} · ${esc(r.account)}</div></div>
          <div class="amt"><b style="color:${v>0?'var(--good)':'var(--bad)'}">${m2(v)}</b></div>
        </div>`;}).join('')}</div>

}

/* --------------------------------------------------------------- Previsions --

   A prevision is a saved guess at the rest of a year: for each category, what
   you expect to spend in each month still to come. The year's budget is then
   the real figures for the months that have happened plus your guess for the
   ones that have not - which is the only number worth looking at in
   September, when a pure forecast ignores two thirds of the evidence and a
   pure actual ignores Christmas.

   Every prevision is kept, dated, and navigable, so you can see what you
   thought in March against what you think now.                              */

const prevList = (Y) => (store.previsions||[]).filter((p)=>p.year===Y)
  .sort((a,b)=>(a.created<b.created?-1:1));

/* Months still to come, including the one we are in - you are part way
   through September, so September is a guess too. */
function futureMonths(Y){
  const out=[];
  const from = Y<YEAR ? 13 : +NOW.slice(5,7);
  for (let i=from;i<=12;i++) out.push(`${Y}-${String(i).padStart(2,'0')}`);
  return out;
}
const prevTotal = (entries) => (entries||[]).reduce((s,e)=>s+(+e.amount||0),0);

/* The forecast for one category: real months as they happened, future months
   as predicted. */
function forecastCat(Y, id, prev){
  const actual = spendByParent(Y)[id] || { months:{} };
  const fut = futureMonths(Y);
  let real=0, guess=0;
  for (const [m,v] of Object.entries(actual.months)) if (!fut.includes(m)) real+=Math.abs(v);
  const byMonth = (prev&&prev.cats&&prev.cats[id])||{};
  for (const m of fut) guess += prevTotal(byMonth[m]);
  return { real, guess, total: real+guess };
}

function previsionCard(Y){
  const list = prevList(Y);
  const idx = Math.min(Math.max(state.prevIdx===null||state.prevIdx===undefined
    ? list.length-1 : state.prevIdx, 0), Math.max(0,list.length-1));
  const cur = list[idx];
  const tax = taxonomy();

  if (!list.length) return `
    <div class="card">
      <h2>Previsions <button class="gbtn" data-newprev="1">+</button></h2>
      <div class="hint" style="margin-top:0">Nothing planned for ${Y}.</div>
    </div>`;

  const cats = tax.PARENTS.filter((p)=>p.kind==='spend');
  const rowsF = cats.map((p)=>({ p, ...forecastCat(Y,p.id,cur) }))
    .filter((r)=>r.total>0.5);
  const spendYear = rowsF.reduce((s,r)=>s+r.total,0);

  /* Income, tax and savings are not forecast by hand - they are the year so
     far carried forward at its own run rate. Stated, not hidden, because it
     is an assumption and a wrong one in a year with a bonus. */
  const f = C.flows(Y, opts());
  const done = Object.keys(f).filter((m)=> Y<YEAR || m<=NOW);
  const s = (k)=>done.reduce((t,m)=>t+f[m][k],0);
  const rate = done.length ? 12/done.length : 1;
  const gross = s('income')*rate, taxes = Math.abs(s('tax'))*rate;
  const saved = Math.abs(s('saved'))*rate;
  const net = gross - taxes;
  const cash = net - spendYear - saved;

  return `
  <div class="card">
    <h2>Previsions <button class="gbtn" data-newprev="1">+</button></h2>
    ${list.length>1
      ? `<div class="navrow">
          <button class="ybtn" data-prevnav="-1" ${idx<=0?'disabled':''}>&lsaquo;&lsaquo;</button>
          <div class="navval">${esc(String(cur.created).slice(0,10))}</div>
          <button class="ybtn" data-prevnav="1" ${idx>=list.length-1?'disabled':''}>&rsaquo;&rsaquo;</button>
        </div>
        <div class="heroSub" style="margin-top:6px">${idx+1} of ${list.length}${
          idx<list.length-1?' — an older one':''}</div>`
      : `<div class="heroSub" style="margin-top:0">made ${esc(String(cur.created).slice(0,10))}</div>`}

    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="l">Income and taxes</div>
        <div class="v">${m0(net)}</div>
        <div class="n">${m0(gross)} gross − ${m0(taxes)} tax</div></div>
      <div class="kpi"><div class="l">Savings and cash</div>
        <div class="v" style="color:${cash>=0?'var(--good)':'var(--bad)'}">${m0(cash)}</div>
        <div class="n">${m0(saved)} saved, ${m0(cash)} left over</div></div>
    </div>

    <div class="sepline"></div>

    <div class="kpis" style="margin-bottom:10px">
      <div class="kpi"><div class="l">Spending, whole year</div>
        <div class="v">${m0(spendYear)}</div>
        <div class="n">${m0(spendYear/12)} a month</div></div>
    </div>
    <div class="tiles">${rowsF.map((r)=>`
      <div class="tile cat" data-editprev="${esc(r.p.id)}">
        <div class="k">${esc(r.p.label)}</div>
        <div class="v">${m0(r.total/12)}</div>
        <div class="s">${m0(r.total)}</div>
      </div>`).join('')}</div>
    
  </div>`;
}
