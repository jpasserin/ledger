/* ---------------------------------------------------------------- Accounts --*/
const CATKEYS = ['cash','savings','estate','excluded'];
/* An account belonging to a child - whoever you have marked as one. */
const isGirl = (a) => (a.owners||[a.owner]).some(isKid);
/* Category tints the tile; the girls override it to pink wherever they appear;
   closed goes grey. Colour is never the only signal - the key, the owner and
   the position in the list all say the same thing. */
const tileClass = (a) => a.closed ? 'shut' : isGirl(a) ? 'girl' : (a.category||'cash');
/* The whole number, never abbreviated. "$255k" reads as an estimate and this
   is a balance; four across 352px leaves ~82px, so the type shrinks a step for
   the long ones rather than the number losing its digits. */
const tileAmt = (v,s) => m0(v,s);

const tile = (a) => { const v=tileAmt(a.native, symOf(a.currency)); return `
  <div class="tile ${tileClass(a)}" data-acct="${esc(a.code)}">
    <div class="k">${esc(a.key||a.code)}</div>
    <div class="v${v.length>9?' long':''}">${v}</div>
    ${a.currency!==state.cur
      ? `<div class="s alt2">(${tileAmt(a.shown, sym())})</div>`
      : `<div class="s">${esc(a.bank || a.subtype || '')}</div>`}
  </div>`; };

/* Euro first, then dollars, then anything else, with the currency named
   between the blocks. Mixing them makes every tile need a second glance. */
const CURORDER = ['EUR','USD','AUD'];
function currencyBlocks(list){
  const seen = [...new Set(list.map((a)=>a.currency))]
    .sort((x,y)=>(CURORDER.indexOf(x)+9)%99 - (CURORDER.indexOf(y)+9)%99);
  return seen.map((c)=>{
    const mine = list.filter((a)=>a.currency===c);
    return `<div class="sep">${c==='EUR'?'Euro':c==='USD'?'Dollar':esc(c)}
      <span>${m0(mine.reduce((s,a)=>s+a.shown,0))}</span></div>${mine.map(tile).join('')}`;
  }).join('');
}

function tabAccounts(){

/* ------------------------------------------------- filtering the operations --

   Four ways in, because four different questions get asked of a statement:
   what did I spend at X, what was that 450 euro thing, what did we spend on
   Food, and what happened in July.                                          */
function filterOps(ops){
  const f = state.opFilter;
  const min = parseFloat(f.min), max = parseFloat(f.max);
  const q = (f.q||'').trim().toLowerCase();
  return ops.filter((r)=>{
    if (q && !(String(r.party||'').toLowerCase().includes(q)
            || String(r.note||'').toLowerCase().includes(q)
            || String(r.group||'').toLowerCase().includes(q))) return false;
    if (f.tag && C.parentOf(r.group)!==f.tag && r.group!==f.tag) return false;
    if (f.subtag && r.group!==f.subtag) return false;
    if (f.oneoff && !r.oneoff) return false;
    if (f.dir==='in' && r.amount <= 0) return false;
    if (f.dir==='out' && r.amount >= 0) return false;
    if (f.from && r.date < f.from) return false;
    if (f.to && r.date > f.to) return false;
    /* An amount search should find 450 out and 450 in - the sign is a
       different question from the size. */
    if (!isNaN(min) && Math.abs(r.amount) < min) return false;
    if (!isNaN(max) && Math.abs(r.amount) > max) return false;
    return true;
  }).sort(sortOps);
}

/* Sorting is part of the filter, not a separate control: you are narrowing a
   list and then deciding how to read it. */
function sortOps(a,b){
  const f = state.opFilter, dir = f.desc===false ? -1 : 1;
  let v;
  if (f.sort==='amount') v = Math.abs(a.amount) - Math.abs(b.amount);
  else if (f.sort==='name') v = String(a.party||'').localeCompare(String(b.party||''));
  else v = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  return v * -dir;
}
const SORTS = [['date','Date'],['amount','Amount'],['name','Name']];
const FILTER_KEYS = ['q','tag','subtag','from','to','min','max','oneoff','dir'];
const filterOn = () => FILTER_KEYS.some((k)=>state.opFilter[k]);
const blankFilter = () => ({ q:'', tag:'', subtag:'', from:'', to:'', min:'', max:'',
  oneoff:false, dir:'', sort:'date', desc:true });

/* The filter, built the way Bench builds one: a field showing the active
   filters as chips, a magnifier beside it, and an absolutely-positioned menu
   that drops from the button rather than pushing the page down. Opening a
   filter must not move the list you are looking at. */
function opFilterCard(ops, shown){
  const tax = taxonomy();
  const f = state.opFilter;
  const menu = state.fmenu;                      // null | 'root' | a field key
  const used = [...new Set(ops.map((r)=>C.parentOf(r.group)))]
    .map((id)=>tax.byId[id]).filter(Boolean)
    .sort((a,b)=>a.label.localeCompare(b.label));
  const subs = [...new Set(ops.map((r)=>r.group))].sort();

  const chip = (k,label) => `<span class="fchip">${esc(label)}<b data-unfilter="${k}">✕</b></span>`;
  const chips = [];
  if (f.q) chips.push(chip('q', f.q));
  if (f.min) chips.push(chip('min','min '+symOf(state.cur)+f.min));
  if (f.max) chips.push(chip('max','max '+symOf(state.cur)+f.max));
  if (f.from) chips.push(chip('from','from '+f.from));
  if (f.to) chips.push(chip('to','to '+f.to));
  if (f.tag) chips.push(chip('tag',(tax.byId[f.tag]||{}).label||f.tag));
  if (f.subtag) chips.push(chip('subtag',f.subtag));
  if (f.oneoff) chips.push(chip('oneoff','one off'));
  if (f.dir) chips.push(chip('dir', f.dir==='in'?'credits':'debits'));

  const item = (k,label,val) => `<button class="fitem" data-fmenu="${k}">${esc(label)}${
    val?`<span>${esc(val)}</span>`:''}</button>`;

  let body = '';
  if (menu === 'root') {
    body = `
      ${filterOn()?`<button class="fitem danger" data-clearfilter="1">Clear filters</button>
        <div class="fsep"></div>`:''}
      ${item('q','Name', f.q)}
      ${item('amount','Amount', f.min||f.max ? (f.min||'…')+'–'+(f.max||'…') : '')}
      ${item('date','Dates', f.from||f.to ? (f.from||'…')+' → '+(f.to||'…') : '')}
      ${item('cat','Category', f.tag ? ((tax.byId[f.tag]||{}).label||f.tag) : '')}
      ${item('subtag','Tag', f.subtag)}
      ${item('oneoff','One off', f.oneoff?'only':'')}

      <div class="fsep"></div>
      ${item('sort','Sort by', (SORTS.find(([k])=>k===f.sort)||[,'Date'])[1]
        + (f.desc===false?' ↑':' ↓'))}`;
  } else if (menu === 'q') {
    body = `<div class="fback" data-fmenu="root">‹ Name</div>
      <input class="fsearch" id="fQ" value="${esc(f.q)}" placeholder="payee or note" autofocus>
      <button class="fitem" data-fapply="q">Apply</button>`;
  } else if (menu === 'amount') {
    body = `<div class="fback" data-fmenu="root">‹ Amount</div>
      <div class="frow"><input id="fMin" value="${esc(f.min)}" placeholder="min" inputmode="decimal">
      <input id="fMax" value="${esc(f.max)}" placeholder="max" inputmode="decimal"></div>
      <button class="fitem" data-fapply="amount">Apply</button>`;
  } else if (menu === 'date') {
    body = `<div class="fback" data-fmenu="root">‹ Dates</div>
      <input class="fsearch" id="fFrom" type="date" value="${esc(f.from)}">
      <input class="fsearch" id="fTo" type="date" value="${esc(f.to)}">
      <button class="fitem" data-fapply="date">Apply</button>`;
  } else if (menu === 'cat') {
    body = `<div class="fback" data-fmenu="root">‹ Category</div>
      <div class="fopts">${used.map((p)=>
        `<button class="fitem ${f.tag===p.id?'on':''}" data-optag="${esc(p.id)}">${esc(p.label)}</button>`).join('')
        || '<div class="fempty">None here.</div>'}</div>`;
  } else if (menu === 'subtag') {
    body = `<div class="fback" data-fmenu="root">‹ Tag</div>
      <div class="fopts">${subs.map((t)=>
        `<button class="fitem ${f.subtag===t?'on':''}" data-opsub="${esc(t)}">${esc(t)}</button>`).join('')
        || '<div class="fempty">None here.</div>'}</div>`;
  } else if (menu === 'dir') {
    body = `<div class="fback" data-fmenu="root">‹ In or out</div>
      <button class="fitem ${f.dir===''?'on':''}" data-fdir="">Both</button>
      <button class="fitem ${f.dir==='in'?'on':''}" data-fdir="in">Credits only</button>
      <button class="fitem ${f.dir==='out'?'on':''}" data-fdir="out">Debits only</button>`;
  } else if (menu === 'sort') {
    body = `<div class="fback" data-fmenu="root">‹ Sort by</div>
      ${SORTS.map(([k,l])=>
        `<button class="fitem ${f.sort===k?'on':''}" data-fsort="${k}">${l}</button>`).join('')}
      <div class="fsep"></div>
      <button class="fitem ${f.desc!==false?'on':''}" data-fdesc="1">Descending ↓</button>
      <button class="fitem ${f.desc===false?'on':''}" data-fdesc="0">Ascending ↑</button>`;
  } else if (menu === 'oneoff') {
    body = `<div class="fback" data-fmenu="root">‹ One off</div>
      <button class="fitem ${f.oneoff?'on':''}" data-foneoff="1">Only one-off entries</button>
      <button class="fitem ${!f.oneoff?'on':''}" data-foneoff="0">All entries</button>`;
  }

  return `<div class="card searchcard">
    <div class="searchrow">
      <div class="fbox">${chips.length?chips.join(''):`<span class="fph">All ${ops.length} entries</span>`}</div>
      <div class="fdrop">
        <button class="iconbtn ${menu?'on':''}" data-togglefilter="1" title="Filter">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        ${menu?`<div class="fmenu show">${body}</div>`:''}
      </div>
    </div>
    ${filterOn()?`<div class="hint">${shown} of ${ops.length}.</div>`:''}
  </div>`;
}


/* ------------------------------------------------------- splitting an entry --

   One purchase, several tags. A supermarket run that was half food and half
   clothes is one line on the statement and two facts about the year. The
   split is stored per row id; the original amount is never changed, and the
   parts must add up to it or it is not a split, it is an error.             */
function splitCard(r, s){
  /* A working copy. Editing store.splits directly would save half-finished
     parts that do not add up, which is worse than no split at all. */
  if (!state.draftSplit) state.draftSplit =
    (store.splits[r.src] || [{ group:r.group, amount:r.amount }]).map((p)=>({...p}));
  const cur = state.draftSplit;
  const tax = taxonomy();
  const sum = cur.reduce((t,p)=>t+(+p.amount||0),0);
  const left = cents(r.amount - sum);
  return `<div class="card">
    <h2><span class="act" data-splitclose="1">‹ Back</span> Split this entry</h2>
    <div class="hero" style="font-size:24px">${m2(r.amount, s)}</div>
    <div class="heroSub">${esc(r.party||'—')} · ${esc(r.date)}</div>
    <div class="rows" style="margin-top:14px">${cur.map((p,i)=>`
      <div class="row flat">
        <div style="flex:1;min-width:0">
          <select data-splitgrp="${i}" style="width:100%">${
            Object.keys(tax.OF).sort().map((g)=>
              `<option ${g===p.group?'selected':''}>${esc(g)}</option>`).join('')}</select>
        </div>
        <div style="width:96px"><input data-splitamt="${i}" value="${p.amount}"
          inputmode="decimal" style="width:100%;text-align:right"></div>
        ${cur.length>1?`<span class="act" data-splitdel="${i}">✕</span>`:''}
      </div>`).join('')}</div>
    <div class="row flat" style="margin-top:6px">
      <div><div class="code" style="font-size:12px">Still to allocate</div></div>
      <div class="amt"><b style="color:${Math.abs(left)<0.005?'var(--good)':'var(--warn)'}">${m2(left,s)}</b></div>
    </div>
    <div class="btnrow" style="margin-top:12px">
      <button class="btn" data-splitadd="1">Add a part</button>
      <button class="btn primary" data-splitsave="${esc(r.src)}"
        ${Math.abs(left)>=0.005?'disabled':''}>Save</button>
    </div>
    ${store.splits[r.src]?`<button class="btn danger" style="margin-top:7px"
      data-splitundo="${esc(r.src)}">Remove the split</button>`:''}
    
  </div>`;
}
const cents = (v) => Math.round(v*100)/100;

/* ------------------------------------------ an investment account's history --

   You asked for shares, price and balance month by month. The books do not
   record a unit count or a unit price - not in any fund or portfolio tab, in
   any year. What they do record is
   Contributions, Interest and Solde: what you paid in, what the market did,
   and where it left you. That answers the same question with the columns that
   exist, and adding shares would mean adding a column to the spreadsheet.  */
function positionCard(a){
  const hist = C.positionHistory(a.code);
  if (!hist.length) return '';
  const s = symOf(a.currency);
  const Y = state.posYear && hist.some((p)=>p.month.startsWith(String(state.posYear)))
    ? state.posYear : +hist[hist.length-1].month.slice(0,4);
  /* Not past today. The sheet fills the rest of the current year with the
     latest figure so its own formulas resolve, which showed as seven flat
     months of "+$0" that had not happened yet. */
  const mine = hist.filter((p)=>p.month.startsWith(String(Y)) && p.month<=NOW);
  const yrs = [...new Set(hist.map((p)=>+p.month.slice(0,4)))].sort();
  const first = mine[0], last = mine[mine.length-1];
  const paidIn = first && last && first.contributions!==null && last.contributions!==null
    ? last.contributions - first.contributions : null;
  const grew = first && last ? last.balance - first.balance : 0;

  return `
  <div class="card">
    <h2>Month by month
      <span class="muted" style="text-transform:none;letter-spacing:0">${esc(a.balanceColumn||'balance')}</span></h2>
    <div class="pillrow">${yrs.map((y)=>
      `<button class="pill ${y===Y?'on':''}" data-posyear="${y}">${y}</button>`).join('')}</div>
    <div class="scroll"><table>
      <thead><tr><th>Month</th><th>Paid in</th><th>Growth</th><th>Balance</th><th>Change</th></tr></thead>
      <tbody>${mine.map((p)=>`<tr>
        <td>${mLabel(p.month)}</td>
        <td>${p.contributions!==null?m0(p.contributions,s):'—'}</td>
        <td>${p.interest!==null?m0(p.interest,s):'—'}</td>
        <td><b>${m0(p.balance,s)}</b></td>
        <td style="color:${p.delta===null?'var(--muted)':p.delta>=0?'var(--good)':'var(--bad)'}">${
          p.delta===null?'—':(p.delta>0?'+':'')+m0(p.delta,s)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="l">Put in during ${Y}</div>
        <div class="v" style="font-size:15px">${paidIn===null?'—':m0(paidIn,s)}</div>
        <div class="n">contributions</div></div>
      <div class="kpi"><div class="l">Balance moved</div>
        <div class="v" style="font-size:15px;color:${grew>=0?'var(--good)':'var(--bad)'}">${
          grew>=0?'+':''}${m0(grew,s)}</div>
        <div class="n">over ${mine.length} month${mine.length>1?'s':''}</div></div>
    </div>
    
  </div>`;
}

function accountDetail(code){
  const a = C.acct(code);
  if (!a) { state.account=null; return tabAccounts(); }
  if (state.editing) return accountForm(code);
  /* The year in the top bar, not everything ever. Opening an account in 2019 and
     being handed 1,729 rows from thirteen years is not "the operations of
     that year". */
  const allOps = C.operations(code, 20000).filter((r)=>r.docYear===state.year);
  if (state.opSplit) {
    const r = allOps.find((x)=>x.src===state.opSplit);
    if (r) return splitCard(r, symOf(a.currency));
    state.opSplit = null;
  }
  const ops = filterOps(allOps);
  const lat = C.latest({...opts(), includeClosed:true}).find((x)=>x.code===code);
  const s = symOf(a.currency);
  const closed = lat ? lat.closed : !!a.closed;
  const lastOp = allOps[0];

  return `
  <div class="card">
    <h2><span class="act" data-back="1">‹ Accounts</span>
      <button class="gbtn ghost" data-edit="${esc(code)}">Edit</button></h2>
    <div class="hero" style="margin-top:2px">${m0(lat?lat.native:0, s)}</div>
    ${a.currency!==state.cur?`<div class="heroSub" style="font-size:15px;color:var(--txt)">(${
      m0(lat?lat.shown:0)})</div>`:''}
    <div class="heroSub"><b style="color:var(--txt)">${esc(a.key||code)}</b>${
      a.bank?' · '+esc(a.bank):''} · ${esc(a.ownerName)}${
      closed?' · <b style="color:var(--warn)">closed</b>':''}</div>
    <div class="heroSub">${lastOp ? `last entry ${esc(lastOp.date)} · ` : ''}${
      lat&&lat.asOf?`as of ${esc(lat.asOf)}`:''}${
      !lastOp&&C.positionHistory(code).length?' · month-end balances, no individual entries':''}</div>
    ${a.code!==(a.key||a.code)?`<div class="hint">Sheet tab <code>${esc(a.code)}</code>.</div>`:''}
  </div>

  ${positionCard(a)}

  ${/* The way IN has to be here whether or not anything is in yet. It used to
        live only on the has-operations branch, so a brand-new account showed
        "nothing recorded" and offered no way to record anything — the one
        screen where the button matters most was the one screen without it.

        A fund or a property records month-end balances rather than entries, so
        those get no add button; there is nothing to type. */
    a.type !== 'ledger' && C.positionHistory(code).length ? '' : `
    ${allOps.length ? opFilterCard(allOps, ops.length) : ''}
    <div class="card">
      <h2>Operations
        <span><button class="gbtn ghost" data-addto="${esc(code)}">import</button>
        <button class="gbtn" data-addentry="${esc(code)}">+</button></span></h2>
      ${!allOps.length ? `<div class="hint" style="margin-top:0">Nothing in ${state.year} yet.</div>` : ''}

      <div class="rows">${ops.slice(0,120).map((r)=>{
        const sp = store.splits[r.src];
        return `<div class="row flat" data-editentry="${esc(r.src)}">
          <div><div class="code" style="font-size:12.5px;font-weight:600">${esc((r.party||'—').slice(0,28))}</div>
            <div class="sub">${r.date} · ${sp
              ? sp.map((p)=>esc(p.group)).join(' + ')+' <b>split</b>'
              : esc(r.group)}${r.note?' · '+esc(r.note.slice(0,16)):''}</div></div>
          <div class="amt"><b style="color:${r.amount<0?'var(--bad)':'var(--good)'}">${m2(r.amount,s)}</b>
            ${r.solde!==null?`<span class="alt">${m0(r.solde,s)}</span>`:''}</div>
        </div>`;}).join('')}</div>
      ${ops.length>120?`<div class="hint">Newest 120 of ${ops.length}.</div>`:''}
      ${!ops.length?`<div class="hint">Nothing matches that filter.</div>`:''}
    </div>`}`;
}

/* ----------------------------------------------------------------- History --*/
const SERIES = [['total','Net worth'],['cash','Cash'],['savings','Savings'],['estate','Property']];
/* Three frames. Money coming in is good when it goes up; money going out is
   good when it goes down - so the colour of a change flips between them, and
   the frames are what make that legible rather than confusing. */
const CMP_FRAMES = [
  { key:'inc', label:'Income, tax and savings', keys:['income','tax','savings'], flip:true },
  { key:'ess', label:'Essential', keys:['essential'], flip:false },
  { key:'opt', label:'Optional',  keys:['optional','other'], flip:false },
];

/* Split out so a slider drag can redraw JUST these, in place. Re-rendering the
   whole tab on every input event replaced the range input under your thumb,
   which on a touch screen cancels the drag - the slider "got stuck" after a
   few pixels. Nothing about the fix is cosmetic. */
function histPlot(pts, color){
  return line({ points:pts, height:148, color });
}
function histKpis(pts){
  const a0 = pts[0]||{v:0,m:'—'}, a1 = pts[pts.length-1]||{v:0,m:'—'};
  const grew = a1.v - a0.v;
  return `<div class="kpis" style="margin-top:12px">
    <div class="kpi"><div class="l">Start</div><div class="v" style="font-size:16px">${m0(a0.v)}</div>
      <div class="n">${esc(a0.m)}</div></div>
    <div class="kpi"><div class="l">End</div><div class="v" style="font-size:16px">${m0(a1.v)}</div>
      <div class="n">${esc(a1.m)}</div></div>
    <div class="kpi"><div class="l">Change</div>
      <div class="v" style="font-size:16px;color:${grew>=0?'var(--good)':'var(--bad)'}">${
        grew>=0?'+':''}${m0(grew)}</div>
      <div class="n">${a0.v?((grew/Math.abs(a0.v)*100).toFixed(0)+'%'):''}</div></div>
  </div>`;
}
/* The window, as indices, resolved the same way the screen does. */
function histWindow(){
  const w = C.wealth(opts());
  const n = w.length;
  let lo = state.histLo===null||state.histLo===undefined ? 0 : state.histLo;
  let hi = state.histHi===null||state.histHi===undefined ? n-1 : state.histHi;
  lo = Math.max(0, Math.min(lo, Math.max(0,n-2)));
  hi = Math.max(lo+1, Math.min(hi, n-1));
  const ser = SERIES.some(([k])=>k===state.series) ? state.series : 'total';
  return { w, n, lo, hi, ser,
    pts: w.slice(lo, hi+1).map((p)=>({ m:p.month, v:p[ser] })),
    color: ser==='total' ? '--c1' : REG.CATEGORY[ser].color };
}
/* Redraw the plot and the boxes without touching the slider elements. */
function histLive(){
  const h = histWindow();
  const plot = document.getElementById('histPlot');
  const kpis = document.getElementById('histKpis');
  if (plot) plot.innerHTML = histPlot(h.pts, h.color);
  if (kpis) kpis.innerHTML = histKpis(h.pts);
  const lab = document.querySelector('.rngv');
  if (lab && h.pts.length) {
    lab.innerHTML = '<span>'+esc(h.pts[0].m)+'</span><span>'+esc(h.pts[h.pts.length-1].m)+'</span>';
  }
}

function tabHistory(){
  const o=opts();
  const w = C.wealth(o);
  /* One line at a time, not four. Cash sits an order of magnitude below the
     total, so on a shared axis it is a flat line at the bottom saying
     nothing - and a second y-axis is the one chart rule never to break. */
  const ser = SERIES.some(([k])=>k===state.series) ? state.series : 'total';
  const serColor = ser==='total' ? '--c1' : REG.CATEGORY[ser].color;

  /* The window, as indices into the month list. Two sliders rather than one:
     a single "last N years" control cannot show you 2016 to 2019. */
  const n = w.length;
  let lo = state.histLo===null||state.histLo===undefined ? 0 : state.histLo;
  let hi = state.histHi===null||state.histHi===undefined ? n-1 : state.histHi;
  lo = Math.max(0, Math.min(lo, n-2)); hi = Math.max(lo+1, Math.min(hi, n-1));
  const win = w.slice(lo, hi+1);
  const pts = win.map((p)=>({ m:p.month, v:p[ser] }));
  const a0 = pts[0]||{v:0,m:'—'}, a1 = pts[pts.length-1]||{v:0,m:'—'};
  const grew = a1.v - a0.v;

  /* Compare the year chosen in the top bar against one picked here. */
  const yrs = C.years(o);
  const b = String(state.year);
  const a = state.cmpA && yrs.includes(String(state.cmpA)) ? String(state.cmpA)
    : (yrs.filter((y)=>y!==b)[0] || b);
  /* Everything, not just spending: income and tax belong in the comparison
     too, and a year where income fell is the thing you most want to see. */
  const catOf={};
  for (const r of C.rows(o)){
    if (r.type==='transfer') continue;
    if (o.livingOnly && r.oneoff) continue;
    const y=r.month.slice(0,4); if (y!==a && y!==b) continue;
    const p=C.parentOf(r.group);
    (catOf[p] || (catOf[p]={}))[y] = (catOf[p][y]||0) + C.conv(r.amount,r.currency,r.month,state.cur);
  }
  const tax = taxonomy();
  const rankedCmp = tax.PARENTS.filter((p)=>catOf[p.id])
    .map((p)=>({ g:p.label, cls:p.cls||'other',
      a:Math.abs(catOf[p.id][a]||0), b:Math.abs(catOf[p.id][b]||0) }))
    .filter((r)=>r.a||r.b);
  const yearEnds = C.byYearEnd(o);

  return `
  <div class="card">
    <h2>Over time
      <select id="selSeries" class="inlinesel">${SERIES.map(([k,label])=>
        `<option value="${k}" ${k===ser?'selected':''}>${esc(label)}</option>`).join('')}</select></h2>
    <div id="histPlot">${histPlot(pts, serColor)}</div>
    <div class="rng">
      <input type="range" id="rLo" min="0" max="${n-2}" value="${lo}">
      <input type="range" id="rHi" min="1" max="${n-1}" value="${hi}">
      <div class="rngv"><span>${esc(a0.m)}</span><span>${esc(a1.m)}</span></div>
    </div>
    <div id="histKpis">${histKpis(pts)}</div>
    ${lo>0||hi<n-1?`<div class="hint"><span class="act" data-rngall="1">Whole range</span></div>`:''}
  </div>

  <div class="card">
    <h2>Year ends</h2>
    <div class="scroll"><table>
      <thead><tr><th>Year</th><th>Cash</th><th>Savings</th><th>Property</th><th>Total</th></tr></thead>
      <tbody>${yearEnds.slice().reverse().map((p)=>`<tr${p.year===b?' style="background:rgba(59,130,246,.10)"':''}>
        <td>${p.year}</td><td>${tnum(p.cash)}</td>
        <td>${tnum(p.savings)}</td><td>${tnum(p.estate)}</td><td><b>${tnum(p.total)}</b></td></tr>`).join('')}</tbody>
    </table></div>
  </div>

  <div class="card">
    <h2>${b} against
      <select id="cmpA" class="inlinesel">${yrs.filter((y)=>y!==b).map((y)=>
        `<option ${y===a?'selected':''}>${y}</option>`).join('')}</select></h2>
        ${rankedCmp.length ? CMP_FRAMES.map((fr)=>{
      const mine = rankedCmp.filter((r)=>fr.keys.includes(r.cls));
      if (!mine.length) return '';
      const ta = mine.reduce((s2,r)=>s2+r.a,0), tb = mine.reduce((s2,r)=>s2+r.b,0);
      const td = tb-ta;
      return `<div class="frame ${fr.key}">
        <div class="frametop">${esc(fr.label)}
          <span style="color:${fr.flip?(td>0?'var(--good)':'var(--bad)'):(td>0?'var(--bad)':'var(--good)')}">${
            td>0?'+':''}${tnum(td)}</span></div>
        <div class="scroll"><table>
          <thead><tr><th>Category</th><th>${a}</th><th>${b}</th><th>Change</th></tr></thead>
          <tbody>${mine.map((r)=>{
            const d = r.b-r.a, pc = r.a ? (d/r.a*100) : null;
            const good = fr.flip ? d>0 : d<0;
            return `<tr><td>${esc(r.g)}</td><td>${r.a?tnum(r.a):'—'}</td><td>${r.b?tnum(r.b):'—'}</td>
              <td style="color:${good?'var(--good)':'var(--bad)'}">${d>0?'+':''}${tnum(d)}${
                pc!==null&&r.a>50?` <span class="muted">${d>0?'+':''}${pc.toFixed(0)}%</span>`:''}</td></tr>`;
          }).join('')}
          <tr><td><b>Total</b></td><td><b>${tnum(ta)}</b></td><td><b>${tnum(tb)}</b></td>
            <td style="color:${fr.flip?(td>0?'var(--good)':'var(--bad)'):(td>0?'var(--bad)':'var(--good)')}">
            <b>${td>0?'+':''}${tnum(td)}</b></td></tr></tbody></table></div>
      </div>`;}).join('')
      : `<div class="hint">No overlap between those two years.</div>`}
  </div>`;
}

/* ------------------------------------------------------------------- Bills --*/
function tabBills(){
  const o=opts();
  const led = C.billsFromLedger(o), grid = C.billsFromGrid(o);
  const kinds=[...new Set([...Object.keys(led),...Object.keys(grid)])].sort();
  const sel = state.bill && kinds.includes(state.bill) ? state.bill : kinds[0];
  const yrs=[...new Set(Object.values(led).flatMap((x)=>Object.keys(x)))].sort();
  const thisYear = (kx) => ((led[kx]||{})[String(YEAR)]||{total:0}).total;
  const ranked = kinds.map((kx)=>({ kx, v:thisYear(kx) })).sort((x,y)=>y.v-x.v);
  const months = Object.keys(((led[sel]||{})[String(YEAR)]||{months:{}}).months).sort();
  const g = (grid[sel]||{})[String(YEAR)];

  return `
  <div class="card">
    <h2>Running costs, ${YEAR}</h2>
    <div class="hero">${m0(ranked.reduce((s,r)=>s+r.v,0))}</div>
    <div class="heroSub">phone, power, internet, insurance, mortgage and HOA</div>
  </div>

  <div class="card">
    <h2>What each one costs</h2>
    <div class="rows">${ranked.filter((r)=>r.v).map((r)=>`
      <div class="row flat" data-bill="${esc(r.kx)}" style="cursor:pointer">
        <div><div class="code" style="font-size:13px">${esc(r.kx)}</div>
          <div class="sub">${m0(r.v/Math.max(1,months.length||1))} a month</div></div>
        <div class="amt"><b>${m0(r.v)}</b></div></div>`).join('')}</div>
  </div>

  <div class="card">
    <h2>${esc(sel||'—')} month by month</h2>
    <div class="pillrow">${kinds.map((kx)=>
      `<button class="pill ${kx===sel?'on':''}" data-bill="${esc(kx)}">${esc(kx)}</button>`).join('')}</div>
    ${months.length ? columns({ labels:months.map(mLabel),
        values:months.map((m)=>((led[sel]||{})[String(YEAR)]||{months:{}}).months[m]||0),
        color:'--c4', height:132 })
      : `<div class="hint">Nothing recorded for ${esc(sel||'')} in ${YEAR}.</div>`}
    ${g ? `` : ''}
  </div>

  <div class="card">
    <h2>Per year</h2>
    <div class="scroll"><table><thead><tr><th>Cost</th>${yrs.map((y)=>`<th>${y}</th>`).join('')}</tr></thead>
      <tbody>${kinds.map((kx)=>`<tr><td>${esc(kx)}</td>${yrs.map((y)=>
        `<td>${(led[kx]||{})[y]?m0((led[kx])[y].total):'—'}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

/* ------------------------------------------------------------------- Girls --*/
function tabGirls(){
  /* Never the owner-excluded view: this tab exists to show their money, so
     hiding it because you have excluded them from your own total would be
     perverse. */
  const o = { ...opts(), excludeOwners:[], asOf:`${state.year}-12`, includeClosed:true };
  const all = C.latest(o);
  /* Whoever is marked as a child in Settings > People, not a hard-coded pair
     of initials. Adding a third child is then a setting, not a code change. */
  const kids = Object.entries(OWNERS())
    .filter(([code])=>isKid(code))
    .map(([code,name])=>({ code, name,
      accounts: all.filter((a)=>(a.owners||[a.owner]).includes(code)) }));
  const total = kids.reduce((s,k)=>s+k.accounts.reduce((t,a)=>t+a.shown,0),0);

  return `
  <div class="card">
    <h2>Kids <span class="muted" style="text-transform:none;letter-spacing:0">end of ${state.year}</span></h2>
    <div class="hero">${m0(total)}</div>
    <div class="heroSub">${kids.reduce((n,k)=>n+k.accounts.length,0)} accounts you manage for
      ${kids.map((k)=>esc(k.name)).join(' and ')}</div>
  </div>

  ${kids.map((k)=>{
    const open = k.accounts.filter((a)=>a.years.includes(state.year) || a.created);
    const shut = k.accounts.filter((a)=>!open.includes(a));
    const sum = open.reduce((t,a)=>t+a.shown,0);
    return `<div class="card">
      <h2>${esc(k.name)}
        <button class="gbtn" data-newkid="${k.code}" title="New account">+</button></h2>
      ${open.length?`
        <div class="hero" style="font-size:24px">${m0(sum)}</div>
        <div class="heroSub" style="margin-bottom:12px">${open.length} account${open.length>1?'s':''}
          open in ${state.year}</div>
        <div class="rows">${open.map((a)=>`
          <div class="row" data-acct="${esc(a.code)}">
            <div><div class="code">${esc(a.key||a.code)}</div>
              <div class="sub">${esc(a.bank||a.subtype||'')}${
                a.owners&&a.owners.length>1?' · shared with '+a.owners.filter((x)=>x!==k.code)
                  .map((x)=>esc(OWNERS()[x]||x)).join(', '):''}</div></div>
            <div class="amt"><b>${m0(a.native, symOf(a.currency))}</b>
              ${a.currency!==state.cur?`<span class="alt">${m0(a.shown)}</span>`:''}</div>
          </div>`).join('')}</div>`
        : `<div class="hint" style="margin-top:0">No account open in ${state.year}.</div>`}
      ${shut.length?`<div class="hint">${shut.map((a)=>esc(a.key||a.code)).join(', ')} —
        not open that year.</div>`:''}
    </div>`;
  }).join('')}`;
}
/* ------------------------------------------------------------- Check sheet --*/
const KIND = {
  'crossed-party':'Crossed counterparties','transfer-unmatched':'Transfer with one side',
  'transfer-is-spending':'Spending hidden as a transfer','should-be-transfer':'Really a transfer',
  'inflow-in-expense':'Income in an expense category','inconsistent-tag':'Tagged inconsistently',
  'possible-duplicate':'Possible double entry','fx-spread':'Conversion worth a look',
  'alias-needed':'Names to map','date-outside-year':'Date in the wrong year',
  'format-lie':'Formatting contradicts the currency' };

const live = () => allFindings().filter((f)=>!dismissed().includes(f.id));
/* ------------------------------------------------------- acting on a check --

   A list of problems you cannot do anything about is just nagging. Each
   finding opens the entry behind it, so it can be corrected, or marked as
   right — which is the honest outcome most of the time: a payee genuinely
   tagged two different ways because it really is two different things.

   Dismissing is per device and reversible. It never touches the entry.      */

const dismissed = () => store.dismissed || (store.dismissed = []);
const findingId = (f, i) => (f.src || f.kind) + '|' + i;

function checksPage(){
  if (state.check) return checkOne();
  const l = live();
  const byKind={}; for (const f of l) (byKind[f.kind]||(byKind[f.kind]=[])).push(f);
  const order = Object.entries(byKind).sort((x,y)=>y[1].length-x[1].length);
  const nDismissed = dismissed().length;
  return `
  <div class="card">
    <h2><span class="act" data-checksback="1">‹ Accounts</span> To check
      <span class="muted" style="text-transform:none;letter-spacing:0">${l.length}</span></h2>
    ${nDismissed?`<button class="btn" style="margin-top:10px" data-undismiss="1">
      Bring back ${nDismissed} marked right</button>`:''}
  </div>
  ${order.map(([kx,list])=>`
    <div class="card"><h2>${esc(KIND[kx]||kx)}
      <span class="muted" style="text-transform:none;letter-spacing:0">${list.length}</span></h2>
      <div class="rows">${list.slice(0,25).map((f)=>`
        <div class="row" data-checkone="${esc(f.id)}">
          <div style="flex:1;min-width:0">
            <div class="code" style="font-size:12.5px">${esc(f.title)}</div>
            <div class="sub">${f.date?esc(f.date):''}${f.account?' · '+esc(f.account):''}</div></div>
          <div class="amt"><b class="muted">›</b></div>
        </div>`).join('')}</div>
      ${list.length>25?`<div class="hint">+ ${list.length-25} more.</div>`:''}
    </div>`).join('')}
  ${!l.length?`<div class="card"><div class="hint" style="margin-top:0">Nothing to check.</div></div>`:''}`;
}

function checkOne(){
  const f = live().concat(allFindings()).find((x)=>x.id===state.check);
  if (!f) { state.check=null; return checksPage(); }
  /* The row this is about, if it is about a row at all. Some findings are
     about the sheet itself - a Total-tab cell, a whole tab's dates. */
  const r = D.ledger.find((x)=>x.src===f.src);
  const a = r ? C.acct(r.account) : null;
  const s = a ? symOf(a.currency) : sym();
  const isDismissed = dismissed().includes(f.id);
  /* Other entries with the same payee, which is what makes an
     inconsistent-tag finding judgeable rather than just alarming. */
  const siblings = r ? D.ledger.filter((x)=>x!==r && x.party===r.party
    && x.account===r.account).slice(0,8) : [];

  return `
  <div class="card">
    <h2><span class="act" data-checkback="1">‹ To check</span>
      ${esc(KIND[f.kind]||f.kind)}</h2>
    <div class="heroSub" style="margin-top:2px;color:var(--txt);font-size:14px">${esc(f.title)}</div>
    <div class="hint">${esc(f.detail)}</div>
  </div>

  ${r?`<div class="card">
    <h2>The entry <button class="gbtn ghost" data-editentry="${esc(r.src)}">Edit</button></h2>
    <div class="rows">
      <div class="row flat"><div><div class="code">${esc(r.party||'—')}</div>
        <div class="sub">${esc(r.date)} · ${esc(r.account)}</div></div>
        <div class="amt"><b style="color:${r.amount<0?'var(--bad)':'var(--good)'}">${
          m2(r.amount,s)}</b></div></div>
      <div class="row flat"><div><div class="code">Tag</div></div>
        <div class="amt"><b>${esc(r.group)}</b></div></div>
      ${r.note?`<div class="row flat"><div><div class="code">Note</div></div>
        <div class="amt"><b>${esc(r.note)}</b></div></div>`:''}
    </div>
  </div>

  ${siblings.length?`<div class="card">
    <h2>Same payee, same account
      <span class="muted" style="text-transform:none;letter-spacing:0">${siblings.length}</span></h2>
    <div class="rows">${siblings.map((x)=>`
      <div class="row flat" data-editentry="${esc(x.src)}">
        <div><div class="code" style="font-size:12.5px">${esc(x.date)}</div>
          <div class="sub">${esc(x.group)}</div></div>
        <div class="amt"><b>${m2(x.amount,s)}</b></div></div>`).join('')}</div>
  </div>`:''}`
  :`<div class="card">
    <h2>Where</h2>
    <div class="hint" style="margin-top:0">${esc(f.src||'—')}${
      f.account?' · '+esc(f.account):''}. This one is about the spreadsheet
      rather than a single entry, so there is nothing here to edit.</div>
  </div>`}

  <div class="card">
    ${isDismissed
      ? `<button class="btn" data-uncheck="${esc(f.id)}">Put it back on the list</button>`
      : `<button class="btn primary" data-okcheck="${esc(f.id)}">This is correct</button>`}
  </div>`;
}

/* Dismissed findings still need to be findable, to be undone. */
const allFindings = () => D.findings.map((f,i)=>({ ...f, id: findingId(f,i) }));

const SETTINGS_TABS = [['data','Data'],['owners','People'],['cats','Categories'],['about','About']];

function tabSettings(){
  if (state.setPage) return setPage();
  const which = SETTINGS_TABS.some(([k])=>k===state.settings) ? state.settings : 'data';
  return `
  <div class="pillrow">${SETTINGS_TABS.map(([id,label])=>
    `<button class="pill ${which===id?'on':''}" data-set="${id}">${label}</button>`).join('')}</div>

    : which==='owners' ? settingsOwners()

}

/* A full-width page inside the tab, not a sheet. Same chrome, one level down,
   with a back link where the heading would be. */

  const p = state.setPage;
  if (p.kind==='person') return personPage();
  if (p.kind==='cat') return catPage();

  state.setPage = null;
  return tabSettings();
}

/* "Updated 12 Sep" — and in amber once it is more than five weeks old, because
   a stale figure presented as current is the one failure mode that matters. */
function renderStamp(){
  const el=document.getElementById('hdrSub'); if(!el) return;
  /* With nothing loaded there is no last entry, and printing today's date
     there would claim one. */
  if (DS.isEmpty(D)) { el.className='hdrsub'; el.innerHTML='nothing loaded yet'; return; }
  const d=new Date(LAST_ENTRY+'T12:00:00Z');
  const age=Math.round((Date.now()-d.getTime())/86400000);
  const txt=`${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  el.className='hdrsub'+(age>35?' stale':'');
  el.innerHTML=`<b>${txt}</b>`+(age>35?` · ${age} days ago`:'');
}

   there. It stays visible but dimmed and says why. */
const YEARLESS = ['history','settings'];

function renderYearBar(){
  const el = document.getElementById('yearBar'); if (!el) return;
  const Y = state.year, i = YEARS.indexOf(Y);
  const off = YEARLESS.includes(state.tab);
  el.className = 'hdryear' + (off ? ' off' : '');
  el.innerHTML = `
    <div class="ystep">
      <select class="ysel" id="yearSel">${YEARS.slice().reverse().map((y)=>
        `<option value="${y}" ${y===Y?'selected':''}>${y}</option>`).join('')}</select>
      <button class="onebtn ${store.showOneOff?'on':''}" id="oneOffTog"
        title="One-off entries — a house sale, a car sale">1</button>
    </div>`;
  const ys=el.querySelector('#yearSel');
  if (ys) ys.onchange=()=>{
    state.year=+ys.value; state.account=null; state.spendCat=null;
    state.checks=false; render(); };
  const ot=el.querySelector('#oneOffTog');
  if (ot) ot.onclick=()=>{ store.showOneOff=!store.showOneOff; save(); render(); };
}

/* Which screen we are on, as a string. A redraw caused by pressing a button
   on the SAME screen must not animate and must not scroll to the top - that
   is the jump. Only actually going somewhere does either. */
const screenKey = () => [state.tab, state.account||'', state.spendCat||'',
  state.entry?'entry':'', state.editing?'edit':'', state.prevDraft?'prev':'',
  state.opSplit||''].join('|');
let lastScreen = null;

function render(){
  const key = screenKey();
  const moved = key !== lastScreen;
  lastScreen = key;
  renderNav();
  renderStamp();
  renderYearBar();
  document.getElementById('tabs').innerHTML =
    `<div class="tab active${moved?' enter':''}">${SCREENS[state.tab]()}</div>`;
  wire();
  if (moved) scrollTo({top:0});
}

/* Read the free-text fields back before any re-render. Chips re-render the
   screen, which would otherwise throw away whatever is half-typed above them. */
function syncForm(){
  if (!state.form) return;
  const g=(id)=>{ const e=document.getElementById(id); return e?e.value:undefined; };
  for (const [id,f] of [['fBank','bank'],['fKey','key'],['fSub','subtype'],['fCode','code']]) {
    const v=g(id); if (v!==undefined) state.form[f]=v.trim();
  }
}

function wire(){
  document.querySelectorAll('[data-acct]').forEach((el)=>el.onclick=()=>{
    state.account=el.dataset.acct; state.tab='accounts'; state.editing=false; state.form=null; render(); });
  document.querySelectorAll('[data-back]').forEach((el)=>el.onclick=()=>{
    if (state.editing) { state.editing=false; state.form=null; }
    else { state.account=null; }
    render(); });
  document.querySelectorAll('[data-newkid]').forEach((el)=>el.onclick=()=>{
    state.account='__new'; state.editing=false;
    state.form=formFrom(null); state.form.owners=[el.dataset.newkid];
    state.tab='accounts'; render(); });
  document.querySelectorAll('[data-new]').forEach((el)=>el.onclick=()=>{
    state.account='__new'; state.editing=false; state.form=null; render(); });
  document.querySelectorAll('[data-edit]').forEach((el)=>el.onclick=()=>{
    state.editing=true; state.form=null; render(); });
  document.querySelectorAll('[data-year]').forEach((el)=>el.onclick=()=>{
    state.year=+el.dataset.year; render(); });
  /* ---- Spend: tiles, the category page, previsions ---- */
  document.querySelectorAll('[data-opencat]').forEach((el)=>el.onclick=()=>{
    state.spendCat=el.dataset.opencat; state.spendMonth=null; render(); });
  document.querySelectorAll('[data-backcat]').forEach((el)=>el.onclick=()=>{
    state.spendCat=null; state.spendMonth=null; render(); });
  document.querySelectorAll('[data-pickmonth]').forEach((el)=>el.onclick=()=>{
    state.spendMonth = state.spendMonth===el.dataset.pickmonth ? null : el.dataset.pickmonth;
    render(); });
  document.querySelectorAll('[data-monthclear]').forEach((el)=>el.onclick=()=>{
    state.spendMonth=null; render(); });

  const syncPrev=()=>{ const d=state.prevDraft; if(!d||!d.cat) return;
    const by=d.cats[d.cat]||{};
    document.querySelectorAll('[data-pl]').forEach((e)=>{
      const [m,j]=e.dataset.pl.split('|'); if(by[m]&&by[m][j]) by[m][j].label=e.value; });
    document.querySelectorAll('[data-pa]').forEach((e)=>{
      const [m,j]=e.dataset.pa.split('|'); if(by[m]&&by[m][j]) by[m][j].amount=e.value; }); };
  document.querySelectorAll('[data-pl],[data-pa]').forEach((e)=>e.onchange=()=>{ syncPrev(); render(); });

  document.querySelectorAll('[data-newprev]').forEach((el)=>el.onclick=()=>{
    /* Start from the last plan for this year. Re-typing a budget you have
       already thought about is how a planning feature stops being used. */
    const last = prevList(state.year).slice(-1)[0];
    state.prevDraft = { cat:null, cats: last ? JSON.parse(JSON.stringify(last.cats)) : {} };
    render(); });
  document.querySelectorAll('[data-editprev]').forEach((el)=>el.onclick=()=>{
    const last = prevList(state.year).slice(-1)[0];
    state.prevDraft = { cat:el.dataset.editprev,
      cats: last ? JSON.parse(JSON.stringify(last.cats)) : {} };
    render(); });
  document.querySelectorAll('[data-prevcat]').forEach((el)=>el.onclick=()=>{
    syncPrev(); state.prevDraft.cat = el.dataset.prevcat || null; render(); });
  document.querySelectorAll('[data-prevadd]').forEach((el)=>el.onclick=()=>{
    syncPrev(); const d=state.prevDraft, m=el.dataset.prevadd;
    const by=d.cats[d.cat]||(d.cats[d.cat]={});
    (by[m]||(by[m]=[])).push({ label:'', amount:'' }); render(); });
  document.querySelectorAll('[data-prevdel]').forEach((el)=>el.onclick=()=>{
    syncPrev(); const [m,j]=el.dataset.prevdel.split('|');
    const by=state.prevDraft.cats[state.prevDraft.cat]||{};
    if (by[m]) by[m].splice(+j,1); render(); });
  document.querySelectorAll('[data-prevcopy]').forEach((el)=>el.onclick=()=>{
    syncPrev(); const d=state.prevDraft, by=d.cats[d.cat]||{};
    const fut=futureMonths(state.year); const src=by[fut[0]]||[];
    for (const m of fut.slice(1)) by[m]=JSON.parse(JSON.stringify(src));
    render(); });
  document.querySelectorAll('[data-prevsave]').forEach((el)=>el.onclick=()=>{
    syncPrev(); const d=state.prevDraft;
    /* Drop blank lines rather than saving rows of nothing. */
    for (const c of Object.keys(d.cats)) for (const m of Object.keys(d.cats[c])) {
      d.cats[c][m]=d.cats[c][m].filter((e)=>+e.amount);
      if (!d.cats[c][m].length) delete d.cats[c][m];
    }
    store.previsions=(store.previsions||[]).concat([{
      id:'p'+Date.now(), year:state.year, created:new Date().toISOString(), cats:d.cats }]);
    save(); state.prevDraft=null; state.prevIdx=null; render(); });
  document.querySelectorAll('[data-prevcancel]').forEach((el)=>el.onclick=()=>{
    state.prevDraft=null; render(); });
  document.querySelectorAll('[data-prevnav]').forEach((el)=>el.onclick=()=>{
    const list=prevList(state.year);
    const cur = state.prevIdx===null||state.prevIdx===undefined ? list.length-1 : state.prevIdx;
    state.prevIdx = Math.min(Math.max(cur + (+el.dataset.prevnav), 0), list.length-1);
    render(); });

  const scur=document.getElementById('savCur');
  if (scur) scur.onchange=()=>{ state.savCur=scur.value; render(); };
  document.querySelectorAll('[data-wsel]').forEach((el)=>el.onclick=()=>{
    state.wsel=el.dataset.wsel; render(); });
  document.querySelectorAll('[data-which]').forEach((el)=>el.onclick=()=>{
    openWhich(el.dataset.which); });
  document.querySelectorAll('[data-posyear]').forEach((el)=>el.onclick=()=>{
    state.posYear=+el.dataset.posyear; render(); });
  const ss=document.getElementById('selScope');
  if (ss) ss.onchange=()=>{ state.spendScope=ss.value; render(); };
  const sc=document.getElementById('selCat');
  if (sc) sc.onchange=()=>{ state.spendCat=sc.value; render(); };
  document.querySelectorAll('[data-spendcat]').forEach((el)=>el.onclick=()=>{
    if (el.dataset.spendcat) { state.spendCat=el.dataset.spendcat; render(); } });
  document.querySelectorAll('[data-openmonth]').forEach((el)=>el.onclick=()=>{
    const tax=taxonomy();
    const pick = state.spendCat && tax.byId[state.spendCat] ? state.spendCat : null;
    openMonthEntries(el.dataset.openmonth, pick || (tax.PARENTS[0]||{}).id); });
  document.querySelectorAll('[data-tagopen]').forEach((el)=>el.onclick=()=>{
    state.openTag = state.openTag===el.dataset.tagopen ? null : el.dataset.tagopen; render(); });

  /* editor */
  document.querySelectorAll('[data-owner]').forEach((el)=>el.onclick=()=>{
    syncForm(); const o=el.dataset.owner, f=state.form;
    f.owners = f.owners.includes(o) ? f.owners.filter((x)=>x!==o) : [...f.owners,o];
    if (!f.owners.length) f.owners=[o];          // an account belongs to someone
    render(); });
  document.querySelectorAll('[data-cat]').forEach((el)=>el.onclick=()=>{
    syncForm(); state.form.category=el.dataset.cat; render(); });
  document.querySelectorAll('[data-type]').forEach((el)=>el.onclick=()=>{
    syncForm(); state.form.type=el.dataset.type; render(); });
  document.querySelectorAll('[data-ccy]').forEach((el)=>el.onclick=()=>{
    syncForm(); state.form.currency=el.dataset.ccy; render(); });

  document.querySelectorAll('[data-save]').forEach((el)=>el.onclick=()=>{
    syncForm(); const f=state.form, isNew=!el.dataset.save;
    const code = isNew ? (f.code||'').trim() : el.dataset.save;
    if (!code) { alert('A sheet code is needed — it is what links the account to its rows.'); return; }
    if (!(f.owners||[]).length) { alert('Pick an owner. Add people first, under the gear.'); return; }
    if (isNew && (registry()[code] || C.acct(code))) { alert(code+' already exists.'); return; }
    const fields = { bank:f.bank, key:f.key||code, type:f.type, subtype:f.subtype,
      category:f.category, currency:f.currency, owners:f.owners, closed:f.closed };
    /* Into the DATASET, not just the per-device override.

       An account that exists only in `store.registry` is re-created from
       nothing by applyRegistry on every render, which throws away the `years`
       that touch() works out from its entries — and balances() walks `years`,
       so the account's money silently stopped counting. The override layer is
       for EDITING an account the data already has; creating one has to write
       the account itself. */
    const existing = D.accounts.find((a)=>a.code===code);
    if (existing) Object.assign(existing, fields);
    else DS.addAccount(D, { code, ...fields });
    /* An edit to an imported account still belongs in the override, so
       "Reset to accounts.js" keeps meaning something. */
    if (!isNew && existing && !existing.created) store.registry[code] = fields;
    saveData(); save(); afterDataChange();
    state.editing=false; state.form=null; state.account=code; render(); });

  document.querySelectorAll('[data-reset]').forEach((el)=>el.onclick=()=>{
    delete store.registry[el.dataset.reset]; save(); applyReg();
    state.editing=false; state.form=null; render(); });

  document.querySelectorAll('[data-close]').forEach((el)=>el.onclick=()=>{
    const code=el.dataset.close, a=C.acct(code);
    const lat=C.latest({...opts(), includeClosed:true}).find((x)=>x.code===code);
    const now = lat ? lat.closed : !!a.closed;
    store.registry[code] = { ...(store.registry[code]||registry()[code]||{}), closed:!now };
    save(); applyReg(); state.editing=false; state.form=null; render(); });

  /* ---- operations: filter, split, import ---- */
  /* Only fields that are actually on screen. Reading a missing input as ""
     would wipe the filter every time the card collapsed. */
  const syncFilter=()=>{ for (const [id,k] of
      [['fQ','q'],['fFrom','from'],['fTo','to'],['fMin','min'],['fMax','max']]) {
    const e=document.getElementById(id); if (e) state.opFilter[k]=e.value; } };
  ['fQ','fFrom','fTo','fMin'].forEach((id)=>{ const e=document.getElementById(id);
    if (e) e.onchange=()=>{ syncFilter(); render(); }; });
  document.querySelectorAll('[data-optag]').forEach((el)=>el.onclick=(ev)=>{
    if (ev) ev.stopPropagation();
    syncFilter();
    state.opFilter.tag = state.opFilter.tag===el.dataset.optag ? '' : el.dataset.optag;
    state.fmenu=null; render(); });
  document.querySelectorAll('[data-clearfilter]').forEach((el)=>el.onclick=(ev)=>{
    if (ev) ev.stopPropagation(); state.opFilter=blankFilter(); state.fmenu=null; render(); });
  document.querySelectorAll('[data-togglefilter]').forEach((el)=>el.onclick=(ev)=>{
    ev.stopPropagation(); state.fmenu = state.fmenu ? null : 'root'; render(); });
  document.querySelectorAll('[data-fmenu]').forEach((el)=>el.onclick=(ev)=>{
    ev.stopPropagation();
    state.fmenu = el.dataset.fmenu==='root' ? 'root' : el.dataset.fmenu; render(); });
  document.querySelectorAll('[data-fapply]').forEach((el)=>el.onclick=(ev)=>{
    ev.stopPropagation(); syncFilter(); state.fmenu='root'; render(); });
  document.querySelectorAll('[data-fdir]').forEach((el)=>el.onclick=(ev)=>{
    ev.stopPropagation(); state.opFilter.dir=el.dataset.fdir; state.fmenu=null; render(); });
  document.querySelectorAll('[data-fsort]').forEach((el)=>el.onclick=(ev)=>{
    ev.stopPropagation(); state.opFilter.sort=el.dataset.fsort; render(); });
  document.querySelectorAll('[data-fdesc]').forEach((el)=>el.onclick=(ev)=>{
    ev.stopPropagation(); state.opFilter.desc=el.dataset.fdesc==='1'; render(); });
  document.querySelectorAll('[data-foneoff]').forEach((el)=>el.onclick=(ev)=>{
    ev.stopPropagation(); state.opFilter.oneoff = el.dataset.foneoff==='1'; state.fmenu=null; render(); });
  /* Anywhere else closes it, the way every menu on a phone should. */
  document.querySelectorAll('.fmenu').forEach((el)=>el.onclick=(ev)=>ev.stopPropagation());
  document.querySelectorAll('[data-unfilter]').forEach((el)=>el.onclick=()=>{
    syncFilter(); state.opFilter[el.dataset.unfilter]=''; render(); });
  document.querySelectorAll('[data-opsub]').forEach((el)=>el.onclick=(ev)=>{
    if (ev) ev.stopPropagation();
    syncFilter();
    state.opFilter.subtag = state.opFilter.subtag===el.dataset.opsub ? '' : el.dataset.opsub;
    state.fmenu=null; render(); });
  document.querySelectorAll('[data-install]').forEach((el)=>el.onclick=async()=>{
    if (!INSTALL_EVT) return;
    INSTALL_EVT.prompt();
    try { await INSTALL_EVT.userChoice; } catch (e) {}
    INSTALL_EVT = null; render(); });

  /* An installed app serves itself from the service worker cache, so an
     ordinary reload can hand you the same old version forever. This throws
     the worker and its caches away first — the only reliable way to leave a
     version behind. Your data is untouched; it lives in localStorage, which
     this does not go near. */
  document.querySelectorAll('[data-hardrefresh]').forEach((el)=>el.onclick=async()=>{
    el.textContent='…';
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r)=>r.unregister()));
      }
      if (typeof caches!=='undefined' && caches.keys) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k)=>caches.delete(k)));
      }
    } catch (e) { /* nothing cached is still a fine state to reload from */ }
    location.reload();
  });

  document.querySelectorAll('[data-explain]').forEach((el)=>el.onclick=()=>{
    explainBox(el.dataset.explain); });
  document.querySelectorAll('[data-checks]').forEach((el)=>el.onclick=()=>{
    state.checks=true; state.tab='accounts'; render(); });
  document.querySelectorAll('[data-checksback]').forEach((el)=>el.onclick=()=>{
    state.checks=false; state.check=null; render(); });
  document.querySelectorAll('[data-checkone]').forEach((el)=>el.onclick=()=>{
    state.check=el.dataset.checkone; render(); });
  document.querySelectorAll('[data-checkback]').forEach((el)=>el.onclick=()=>{
    state.check=null; render(); });
  document.querySelectorAll('[data-okcheck]').forEach((el)=>el.onclick=()=>{
    dismissed().push(el.dataset.okcheck); save(); state.check=null; render(); });
  document.querySelectorAll('[data-uncheck]').forEach((el)=>el.onclick=()=>{
    store.dismissed = dismissed().filter((x)=>x!==el.dataset.uncheck);
    save(); state.check=null; render(); });
  document.querySelectorAll('[data-undismiss]').forEach((el)=>el.onclick=()=>{
    if (!confirm('Put all ' + dismissed().length + ' back on the list?')) return;
    store.dismissed=[]; save(); render(); });

  /* ---- Settings ---- */
  const back=()=>{ state.setPage=null; render(); };
  document.querySelectorAll('[data-set]').forEach((el)=>el.onclick=()=>{
    state.settings=el.dataset.set; state.setPage=null; render(); });
  document.querySelectorAll('[data-setback]').forEach((el)=>el.onclick=back);

  /* data: import, export, wipe */
  document.querySelectorAll('[data-doimport]').forEach((el)=>el.onclick=()=>{
    const inp=document.getElementById('fImport');
    if (!inp) { alert('No file picker on this screen.'); return; }
    inp.onchange=()=>{
      const f=inp.files && inp.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=async()=>{
        let next;
        try { next = DS.parseImport(String(rd.result)); }
        catch (err) { alert(err.message); return; }
        const n=next.ledger.length, a=next.accounts.length;
        if (!confirm('Import '+n.toLocaleString('en-US')+' entries and '+a
          +' accounts? This replaces everything in the app.')) return;
        D = next;
        const ok = await DS.saveAsync(D);
        if (!ok) {
          alert('Could not store it: ' + (DS.storageError() || 'unknown')
            + '. The data is loaded for this session only.');
          LedgerCore.init(D); applyReg(); render();
          return;
        }
        location.reload();
      };
      rd.onerror=()=>alert('Could not read that file.');
      rd.readAsText(f);
    };
    inp.click(); });

  document.querySelectorAll('[data-doexport]').forEach((el)=>el.onclick=()=>{
    const blob=new Blob([DS.exportBlob(D)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='ledger-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000); });

  document.querySelectorAll('[data-wipe]').forEach((el)=>el.onclick=async()=>{
    if (!confirm('Erase every account and entry on this device?')) return;
    if (!confirm('There is no undo.')) return;
    D = DS.empty(); await DS.saveAsync(D); location.reload(); });

  /* backend */
  const bkRead=()=>{ const u=document.getElementById('bkUrl'), t=document.getElementById('bkTok');
    store.backend=store.backend||{};
    if (u) store.backend.url=u.value.trim();
    if (t) store.backend.token=t.value.trim();
    save(); return store.backend; };
  document.querySelectorAll('[data-bktest]').forEach((el)=>el.onclick=async()=>{
    const cfg=bkRead();
    state.syncState={ msg:'Testing…' }; render();
    try { const j=await BK.ping(cfg);
      store.backendVersion=j.backend; save();
      state.syncState={ msg:'Connected — backend v'+j.backend }; }
    catch(e){ state.syncState={ msg:e.message, bad:true }; }
    render(); });
  document.querySelectorAll('[data-bksync]').forEach((el)=>el.onclick=async()=>{
    const cfg=bkRead();
    state.syncState={ msg:'Syncing…' }; render();
    try { const j=await BK.push(cfg, D);
      store.backendVersion=j.backend; save();
      state.syncState={ msg:'Sent '+D.ledger.length+' entries' }; }
    catch(e){ state.syncState={ msg:e.message, bad:true }; }
    render(); });

  /* people */
  document.querySelectorAll('[data-personnew]').forEach((el)=>el.onclick=()=>{
    state.setPage={ kind:'person', code:'', name:'', kindSel:'parent' }; render(); });
  document.querySelectorAll('[data-personedit]').forEach((el)=>el.onclick=()=>{
    const o=el.dataset.personedit;
    state.setPage={ kind:'person', code:o, name:OWNERS()[o]||o, kindSel:ownerKind(o) }; render(); });
  document.querySelectorAll('[data-okind]').forEach((el)=>el.onclick=()=>{
    const n=document.getElementById('oName'), c=document.getElementById('oCode');
    if (n) state.setPage.name=n.value;
    if (c && !state.setPage.code) state.setPage.code=c.value;
    state.setPage.kindSel=el.dataset.okind; render(); });
  document.querySelectorAll('[data-osave]').forEach((el)=>el.onclick=()=>{
    const p=state.setPage;
    const n=document.getElementById('oName'), c=document.getElementById('oCode');
    const name=(n&&n.value||'').trim();
    const code=(p.code||(c&&c.value)||'').trim().toUpperCase();
    if (!name||!code) { alert('A name and a code.'); return; }
    if (!p.code && OWNERS()[code]) { alert(code+' is taken.'); return; }
    DS.setOwner(D, code, name, p.kindSel || (p.code?ownerKind(p.code):'parent'));
    state.setPage=null; saveData(); afterDataChange(); render(); });
  document.querySelectorAll('[data-odelete]').forEach((el)=>el.onclick=()=>{
    if (!confirm('Delete this person?')) return;
    try { DS.removeOwner(D, el.dataset.odelete); }
    catch(e){ alert(e.message); return; }
    state.setPage=null; saveData(); afterDataChange(); render(); });

  /* categories */
  document.querySelectorAll('[data-catnew]').forEach((el)=>el.onclick=()=>{
    state.setPage={ kind:'cat', id:'', name:'', cls:'optional' }; render(); });
  document.querySelectorAll('[data-catedit]').forEach((el)=>el.onclick=()=>{
    state.setPage={ kind:'cat', id:el.dataset.catedit }; render(); });
  document.querySelectorAll('[data-newcls]').forEach((el)=>el.onclick=()=>{
    const n=document.getElementById('cName'); if (n) state.setPage.name=n.value;
    state.setPage.cls=el.dataset.newcls; render(); });
  document.querySelectorAll('[data-setcls]').forEach((el)=>el.onclick=()=>{
    const n=document.getElementById('cName'); if (n) state.setPage.name=n.value;
    DS.setCategoryClass(D, state.setPage.id, el.dataset.setcls); commit(); });
  document.querySelectorAll('[data-csave]').forEach((el)=>el.onclick=()=>{
    const p=state.setPage;
    const n=document.getElementById('cName');
    const label=(n&&n.value||'').trim();
    if (!label) { alert('A name.'); return; }
    try {
      if (!p.id) DS.addCategory(D, label, p.cls || 'optional');
      else DS.renameCategory(D, p.id, label);
    } catch (e) { alert(e.message); return; }
    state.setPage=null; commit(); });
  document.querySelectorAll('[data-cdelete]').forEach((el)=>el.onclick=()=>{
    if (!confirm('Delete this category?')) return;
    try { DS.removeCategory(D, el.dataset.cdelete); }
    catch (e) { alert(e.message); return; }
    state.setPage=null; commit(); });

  /* tags */
  document.querySelectorAll('[data-tagnew]').forEach((el)=>el.onclick=()=>{
    state.setPage={ kind:'tag', tag:'', name:'', parent:el.dataset.tagnew, isNew:true }; render(); });
  document.querySelectorAll('[data-tagedit]').forEach((el)=>el.onclick=()=>{
    state.setPage={ kind:'tag', tag:el.dataset.tagedit }; render(); });
  document.querySelectorAll('[data-tparent]').forEach((el)=>el.onclick=()=>{
    const n=document.getElementById('tName'); if (n) state.setPage.name=n.value;
    state.setPage.parent=el.dataset.tparent; render(); });
  document.querySelectorAll('[data-tsave]').forEach((el)=>el.onclick=()=>{
    const p=state.setPage;
    const n=document.getElementById('tName');
    const name=(n&&n.value||'').trim();
    if (!name) { alert('A name.'); return; }
    const parent=p.parent || taxonomy().OF[p.tag];
    if (!parent) { alert('Pick a category.'); return; }
    try {
      if (p.isNew) DS.addTag(D, name, parent);
      else {
        DS.moveTag(D, p.tag, parent);
        /* Renaming changes the LABEL, not the key: the key is what every entry
           carries, and rewriting it would orphan them. */
        DS.renameTag(D, p.tag, name);
      }
    } catch (e) { alert(e.message); return; }
    state.setPage=null; commit(); });
  document.querySelectorAll('[data-tdelete]').forEach((el)=>el.onclick=()=>{
    const t=el.dataset.tdelete;
    const n=D.ledger.filter((r)=>r.group===t).length;
    if (!confirm(n ? 'That tag is on '+n+' entries. Unfile it? The entries stay.' : 'Delete this tag?')) return;
    DS.removeTag(D, t);
    state.setPage=null; commit(); });

  /* ---- budgets ---- */
  document.querySelectorAll('[data-newbudget]').forEach((el)=>el.onclick=()=>{
    state.budgetEdit={ id:null, name:'', amount:'' }; render(); });
  document.querySelectorAll('[data-openbudget]').forEach((el)=>el.onclick=()=>{
    state.budget=el.dataset.openbudget; render(); });
  document.querySelectorAll('[data-bback]').forEach((el)=>el.onclick=()=>{
    state.budget=null; render(); });
  document.querySelectorAll('[data-bedit]').forEach((el)=>el.onclick=()=>{
    const b=budgetOf(el.dataset.bedit); if(!b) return;
    state.budgetEdit={ ...b }; render(); });
  document.querySelectorAll('[data-bcancel]').forEach((el)=>el.onclick=()=>{
    state.budgetEdit=null; render(); });
  document.querySelectorAll('[data-bsave]').forEach((el)=>el.onclick=()=>{
    const n=document.getElementById('bName'), a=document.getElementById('bAmount');
    const name=(n&&n.value||'').trim(), amount=Math.abs(parseFloat(a&&a.value));
    if (!name) { alert('A name, please.'); return; }
    if (!isFinite(amount)) { alert('An amount, please.'); return; }
    const cur=state.budgetEdit;
    if (cur.id) { const b=budgetOf(cur.id); b.name=name; b.amount=amount; }
    else budgets().push({ id:DS.uid('b'), name, amount, created:new Date().toISOString() });
    state.budgetEdit=null; save(); render(); });
  document.querySelectorAll('[data-bclose]').forEach((el)=>el.onclick=()=>{
    const b=budgetOf(el.dataset.bclose); if(!b) return;
    if (b.closed) { delete b.closed; }
    else {
      /* Closed as of the last day with data, not "now" - looking at 2019 and
         closing something should not stamp it 2026. */
      b.closed = state.year===YEAR ? LAST_ENTRY : state.year+'-12-31';
    }
    save(); render(); });
  document.querySelectorAll('[data-bdelete]').forEach((el)=>el.onclick=()=>{
    const id=el.dataset.bdelete;
    const n=budgetRows(id).length;
    if (!confirm(n
      ? n + ' entries are tagged with this budget. Deleting it untags them; the entries'
        + ' themselves stay exactly where they are. Delete the budget?'
      : 'Delete this budget?')) return;
    for (const r of D.ledger) if (r.budget===id) delete r.budget;
    store.budgets = budgets().filter((b)=>b.id!==id);
    state.budgetEdit=null; state.budget=null; save(); saveData(); render(); });

  /* ---- entries ---- */
  const newEntry=(code)=>({ account:code, date:TODAY, party:'', amount:'',
    sign:-1, group:'', note:'', oneoff:false, budget:'', src:null });
  document.querySelectorAll('[data-addentry]').forEach((el)=>el.onclick=()=>{
    state.entry=newEntry(el.dataset.addentry||state.account); state.tab='accounts'; render(); });
  document.querySelectorAll('[data-editentry]').forEach((el)=>el.onclick=()=>{
    const r=D.ledger.find((x)=>x.src===el.dataset.editentry); if(!r) return;
    state.entry={ account:r.account, date:r.date, party:r.party,
      amount:Math.abs(r.amount), sign:r.amount<0?-1:1, group:r.group, note:r.note,
      oneoff:!!r.oneoff, budget:r.budget||'', src:r.src };
    render(); });
  const syncEntry=()=>{ const e=state.entry; if(!e) return;
    const g=(id)=>{const x=document.getElementById(id);return x?x.value:undefined;};
    const m={ eAcct:'account', eDate:'date', eParty:'party', eAmount:'amount',
      eGroup:'group', eNote:'note' };
    for (const [id,f] of Object.entries(m)) { const v=g(id); if (v!==undefined) e[f]=v; } };
  document.querySelectorAll('[data-esign]').forEach((el)=>el.onclick=()=>{
    syncEntry(); state.entry.sign=+el.dataset.esign; render(); });
  document.querySelectorAll('[data-eoneoff]').forEach((el)=>el.onclick=()=>{
    syncEntry(); state.entry.oneoff=!state.entry.oneoff; render(); });
  document.querySelectorAll('[data-ebudget]').forEach((el)=>el.onclick=()=>{
    syncEntry();
    state.entry.budget = state.entry.budget===el.dataset.ebudget ? '' : el.dataset.ebudget;
    render(); });
  document.querySelectorAll('[data-ecancel]').forEach((el)=>el.onclick=()=>{
    state.entry=null; render(); });
  document.querySelectorAll('[data-esave]').forEach((el)=>el.onclick=()=>{
    syncEntry(); const e=state.entry;
    const amt=Math.abs(parseFloat(e.amount));
    if (!e.account) { alert('Pick an account.'); return; }
    if (!e.date) { alert('Pick a date.'); return; }
    if (!isFinite(amt) || amt===0) { alert('An amount, please.'); return; }
    if (!e.group) { alert('Pick a tag — an untagged entry cannot be reported on.'); return; }
    const a=D.accounts.find((x)=>x.code===e.account);
    const tax=taxonomy();
    const kind=(tax.byId[tax.OF[e.group]]||{}).kind || 'spend';
    const payload={ account:e.account, date:e.date, party:e.party,
      amount:amt*(e.sign<0?-1:1), group:e.group, note:e.note,
      oneoff:!!e.oneoff, budget:e.budget||undefined,
      currency:a?a.currency:'USD', type:kind };
    if (e.src) DS.updateEntry(D, e.src, payload); else DS.addEntry(D, payload);
    state.entry=null; commit(); });
  document.querySelectorAll('[data-edelete]').forEach((el)=>el.onclick=()=>{
    if (!confirm('Delete this entry?')) return;
    DS.deleteEntry(D, el.dataset.edelete); state.entry=null; commit(); });

  document.querySelectorAll('[data-addto]').forEach((el)=>el.onclick=()=>{
    alert('Import and manual entry are the next piece of work. When they land they will read a bank '
      + 'export, propose a tag per line from the ' + D.merchants.length + ' payees already learned '
      + 'from your own history, and write to a new planning sheet — never to your year books.'); });

  document.querySelectorAll('[data-split]').forEach((el)=>el.onclick=()=>{
    state.opSplit=el.dataset.split; render(); });
  document.querySelectorAll('[data-splitclose]').forEach((el)=>el.onclick=()=>{
    state.opSplit=null; state.draftSplit=null; render(); });
  const draft=()=>state.draftSplit;
  const syncSplit=()=>{ const d=draft(); if(!d) return;
    document.querySelectorAll('[data-splitgrp]').forEach((e)=>{ d[+e.dataset.splitgrp].group=e.value; });
    document.querySelectorAll('[data-splitamt]').forEach((e)=>{ d[+e.dataset.splitamt].amount=e.value; }); };
  document.querySelectorAll('[data-splitgrp],[data-splitamt]').forEach((e)=>
    e.onchange=()=>{ syncSplit(); render(); });
  document.querySelectorAll('[data-splitadd]').forEach((el)=>el.onclick=()=>{
    syncSplit(); const d=draft(); if(d) d.push({ group:'Misc', amount:0 }); render(); });
  document.querySelectorAll('[data-splitdel]').forEach((el)=>el.onclick=()=>{
    syncSplit(); const d=draft(); if(d) d.splice(+el.dataset.splitdel,1); render(); });
  document.querySelectorAll('[data-splitsave]').forEach((el)=>el.onclick=()=>{
    syncSplit(); const d=draft(); if(!d) return;
    store.splits[el.dataset.splitsave]=d.map((p)=>({ group:p.group, amount:+p.amount }));
    save(); state.opSplit=null; state.draftSplit=null; render(); });
  document.querySelectorAll('[data-splitundo]').forEach((el)=>el.onclick=()=>{
    delete store.splits[el.dataset.splitundo];
    save(); state.opSplit=null; state.draftSplit=null; render(); });
  document.querySelectorAll('[data-go]').forEach((el)=>el.onclick=()=>{ state.tab=el.dataset.go; render(); });
  document.querySelectorAll('[data-go-import]').forEach((el)=>el.onclick=()=>{
    state.settings='data'; state.tab='settings'; state.setPage=null; render(); });
  document.querySelectorAll('[data-month]').forEach((el)=>el.onclick=()=>{
    state.spendMonth = state.spendMonth===el.dataset.month ? null : el.dataset.month; render(); });
  document.querySelectorAll('[data-bill]').forEach((el)=>el.onclick=()=>{ state.bill=el.dataset.bill; render(); });
  document.querySelectorAll('[data-girls]').forEach((el)=>el.onclick=()=>{
    const kids = Object.keys(OWNERS()).filter(isKid);
    store.excludeOwners = el.dataset.girls==='out'
      ? [...new Set([...store.excludeOwners, ...kids])]
      : store.excludeOwners.filter((x)=>!kids.includes(x));
    save(); render(); });
  const rl=document.getElementById('rLo'), rh=document.getElementById('rHi');
  /* oninput, not onchange: the graph should follow your thumb. Redrawing an
     SVG of a hundred points is nothing, and waiting for release makes the
     control feel broken. The slider is re-focused after each redraw so the
     drag survives the innerHTML swap. */
  if (rl) rl.oninput=()=>{ state.histLo=+rl.value;
    if (state.histHi!==null && state.histHi<=state.histLo) state.histHi=state.histLo+1;
    histLive(); };
  if (rh) rh.oninput=()=>{ state.histHi=+rh.value;
    if (state.histLo!==null && state.histLo>=state.histHi) state.histLo=state.histHi-1;
    histLive(); };
  /* One full render when the thumb is released, so the year-ends table and the
     comparison catch up with the window. */
  if (rl) rl.onchange=()=>render();
  if (rh) rh.onchange=()=>render();
  document.querySelectorAll('[data-rngall]').forEach((el)=>el.onclick=()=>{
    state.histLo=null; state.histHi=null; render(); });
  const sv=document.getElementById('selSeries');
  if (sv) sv.onchange=()=>{ state.series=sv.value; render(); };
  const cm=document.getElementById('cmpA');
  if (cm) cm.onchange=()=>{ state.cmpA=+cm.value; render(); };
}

document.querySelectorAll('#curTog button').forEach((b)=>b.onclick=()=>{
  state.cur=b.dataset.cur;
  document.querySelectorAll('#curTog button').forEach((x)=>x.classList.toggle('on', x.dataset.cur===state.cur));
  render();
});
document.getElementById('btnSettings').onclick = ()=>{
  state.tab='settings'; state.setPage=null; render(); };

/* Deep links so a tab can be screenshotted or linked: #spend?cur=EUR */
let OPEN_SHEET = null;
function readHash(){
  const [t,qs]=location.hash.replace(/^#/,'').split('?');
  if (SCREENS[t]) state.tab=t;
  const q=new URLSearchParams(qs||'');
  if (q.get('cur')) state.cur = q.get('cur').toUpperCase()==='EUR' ? 'EUR' : 'USD';
  if (q.get('acct')) { state.account=q.get('acct'); state.tab='accounts'; }
  if (q.get('edit')) { state.account=q.get('edit'); state.editing=true; state.tab='accounts'; }
  if (q.get('new')) { state.account='__new'; state.tab='accounts'; }
  if (q.get('year')) state.year = +q.get('year');
  /* Dev links straight into a sheet, so the Settings and Check screens can be
     screenshotted like any tab. */
  if (q.get('settings')) { state.settings = q.get('settings'); state.tab='settings'; }
  if (q.get('check')) { state.checks = true; state.tab = 'accounts'; }
  if (q.get('month')) state.spendMonth=q.get('month');
  document.querySelectorAll('#curTog button').forEach((x)=>x.classList.toggle('on', x.dataset.cur===state.cur));
}
addEventListener('hashchange', ()=>{ readHash(); render(); });

/* Dev probe: #today?debugw=1 lists anything wider than the column. A
   phone-first layout fails silently by pushing content off the right edge, and
   there is no console to read in a headless screenshot. */
function debugWidths(){
  const host=document.querySelector('.wrap'); if(!host) return;
  const limit=host.clientWidth;
  const bad=[...document.querySelectorAll('.wrap *')]
    .map((e)=>({e, w:Math.round(e.scrollWidth), r:Math.round(e.getBoundingClientRect().width)}))
    .filter((x)=>x.w>limit+1)
    .slice(0,14);
  const nav=document.querySelector('nav');
  const navW=nav?Math.round(nav.scrollWidth):0;
  const box=document.createElement('div');
  box.className='card';
  box.innerHTML=`<h2>Width probe</h2>
    <div class="hint" style="margin-top:0">viewport ${innerWidth} · column ${limit} ·
      document ${document.documentElement.scrollWidth} · nav ${navW}</div>
    ${bad.length?`<div class="rows">${bad.map((x)=>`<div class="row flat">
      <div><div class="code" style="font-size:12px">${esc(x.e.tagName.toLowerCase())}${
        x.e.className?'.'+esc(String(x.e.className).split(' ')[0]):''}</div>
        <div class="sub">${esc((x.e.textContent||'').trim().slice(0,30))}</div></div>
      <div class="amt"><b>${x.w}px</b><span class="alt">shown ${x.r}</span></div></div>`).join('')}</div>`
      : '<div class="hint">Nothing overflows.</div>'}`;
  host.appendChild(box);
}

/* Install the offline cache, but only when served over http - opening
   index.html straight off the disk has no origin to register against, and the
   failed registration would throw in the console every time. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

readHash();
render();
adoptStored();
if (OPEN_SHEET) OPEN_SHEET();
if (/debugw/.test(location.hash)) setTimeout(debugWidths, 50);
</script>
</body>
</html>
